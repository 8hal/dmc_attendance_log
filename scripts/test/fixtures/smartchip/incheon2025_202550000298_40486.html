function goLivePhotoBack() {
    var usedata = "";
    try {
        usedata = new URLSearchParams(window.location.search || "").get("usedata") || "";
    } catch (e) {}

    var searchPage = (String(usedata || "").trim() === "202650000130") ? "/Search_Ballyno_namebib.html" : "/Search_Ballyno.html";
    var backPath = searchPage + (usedata ? ("?usedata=" + encodeURIComponent(usedata)) : "");
    var backUrl = "https://smartchip.co.kr" + backPath;

    function findFrameIn(doc) {
        if (!doc) return null;
        return doc.getElementById("myFrame") || doc.getElementById("mainFrame");
    }

    try { sessionStorage.setItem("iframeUrl", backUrl); } catch (e) {}

    // 1) 현재 문서에 iframe이 있으면 그 iframe만 조회 페이지로 이동
    try {
        var iframe = findFrameIn(document);
        if (iframe) {
            iframe.src = backUrl;
            return;
        }
    } catch (e) {}

    // 2) 현재 페이지가 iframe 안이면 부모의 iframe만 조회 페이지로 이동
    if (window.self !== window.top) {
        try {
            var topFrame = findFrameIn(window.top.document);
            if (topFrame) {
                try { window.top.sessionStorage.setItem("iframeUrl", backUrl); } catch (e2) {}
                topFrame.src = backUrl;
                return;
            }
        } catch (e) {}
    }

    // 3) 단독 페이지면 현재 창 이동
    try {
        window.location.href = backPath;
    } catch (e) {
        window.location.replace(backPath);
    }
}

<script>
    let cleanCanvasAPI = null;
    let cleanMeasureAPI = null;

    function getCleanAPI() {
        if (cleanCanvasAPI && cleanMeasureAPI) return { fill: cleanCanvasAPI, measure: cleanMeasureAPI };
        try {
            if (document.createElement.toString().indexOf('[native code]') === -1) {
                throw new Error("Hooking detected");
            }
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
            
            cleanCanvasAPI = iframe.contentWindow.CanvasRenderingContext2D.prototype.fillText;
            cleanMeasureAPI = iframe.contentWindow.CanvasRenderingContext2D.prototype.measureText;
        } catch(e) {
            cleanCanvasAPI = CanvasRenderingContext2D.prototype.fillText;
            cleanMeasureAPI = CanvasRenderingContext2D.prototype.measureText;
        }
        return { fill: cleanCanvasAPI, measure: cleanMeasureAPI };
    }

    function secureDrawText(ctx, text, canvasWidth, yPos) {
        const api = getCleanAPI();
        
        ctx.textAlign = "left"; 
        ctx.textBaseline = "middle";

        let totalWidth = 0;
        let charData = [];
        const junkChars = ['A','X','9','-','!','O','?','*'];

        for(let k=0; k<15; k++) {
            api.measure.call(ctx, junkChars[Math.floor(Math.random() * junkChars.length)]);
        }

        for (let i = 0; i < text.length; i++) {
            let char = text[i];
            let charW = api.measure.call(ctx, char).width;
            
            api.measure.call(ctx, junkChars[Math.floor(Math.random() * junkChars.length)]);
            
            charData.push({ char: char, width: charW });
            totalWidth += charW;
        }

        let currentX = (canvasWidth - totalWidth) / 2;
        let renderQueue = [];

        charData.forEach(item => {
            renderQueue.push({ char: item.char, x: currentX, y: yPos });
            currentX += item.width;
        });

        junkChars.forEach(f => {
            renderQueue.push({ char: f, x: -9999, y: yPos }); 
        });

        for (let i = renderQueue.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [renderQueue[i], renderQueue[j]] = [renderQueue[j], renderQueue[i]];
        }

        renderQueue.forEach(item => {
            api.fill.call(ctx, item.char, item.x, item.y);
        });
    }

    function decryptData(secret) {
        if (!secret) return "";
        const _k = [239,238,158,233,146,239,235,158,156,233,152,233,158,236,155,236,232,155,153,156,147,233,153,233];
        let text = "";
        let _s = 0, _i = 0, _c = 0, _kCode = 0;

        if (_k.length > 0) {
            while(_s !== 99) {
                switch(_s) {
                    case 0:
                        _s = (_i < secret.length) ? 1 : 99;
                        break;
                    case 1:
                        _c = parseInt(secret.substr(_i, 4), 16);
                        _s = 2;
                        break;
                    case 2:
                        _kCode = _k[(_i / 4) % _k.length] ^ 170;
                        _s = 3;
                        break;
                    case 3:
                        text += String.fromCharCode(_c ^ _kCode);
                        _i += 4;
                        _s = 0;
                        break;
                }
            }
        }
        return text;
    }

    function drawTextCanvas(targetId, secretText) {
        let text = decryptData(secretText);

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const scale = window.devicePixelRatio || 1;
        const width = 350;
        const height = 60;

        canvas.width = width * scale;
        canvas.height = height * scale;
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.scale(scale, scale);
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, width, height);
        ctx.font = "700 58px 'JamsilBold', '맑은고딕', 'sans-serif'";
        ctx.fillStyle = "#08FF00"; 
        ctx.textBaseline = "middle";

        secureDrawText(ctx, text, width, height / 2);

        const target = document.getElementById(targetId);
        if (target) {
            target.innerHTML = "";
            target.appendChild(canvas);
        }
    }

    function replaceSpanWithCanvas(span) {
        let text = decryptData(span.dataset.secret);
        if (!text) return;

        const style = window.getComputedStyle(span);
        const fontSize   = style.fontSize || "14px";
        const fontFamily = style.fontFamily || "'The Jamsil', '맑은고딕', sans-serif";
        const fontWeight = style.fontWeight || "700";
        const color      = style.color || "#08FF00";
        const lineHeight = style.lineHeight;

        const scale = window.devicePixelRatio || 1;
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        const api = getCleanAPI();
        ctx.font = `${fontWeight} ${fontSize} ${fontFamily}`;
        const width = Math.ceil(api.measure.call(ctx, text).width) + 6; 

        let height = parseFloat(fontSize) * 1.5;
        //if (lineHeight !== "normal" && lineHeight.includes("px")) {
        //    height = parseFloat(lineHeight);
        //}

        canvas.width  = width * scale;
        canvas.height = height * scale;
        canvas.style.width  = width + "px";
        canvas.style.height = height + "px";
        canvas.style.display = style.display === 'block' ? 'block' : 'inline-block';
        canvas.style.verticalAlign = "middle"; 

        ctx.scale(scale, scale);
        ctx.font = `${fontWeight} ${fontSize} ${fontFamily}`;
        ctx.fillStyle = color;
        ctx.textBaseline = "middle";

        secureDrawText(ctx, text, width, height / 2 + 1);
        span.replaceWith(canvas);
    }

	var gradientFill = ctx.createLinearGradient(0, 0, 0, 150);
    gradientFill.addColorStop(0, 'rgba(255, 255, 255, 0.45)'); 
    gradientFill.addColorStop(1, 'rgba(0, 0, 0, 0)');

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: rawLabels,
            datasets: [{
                data: rawData,
                borderColor: '#fff',
                backgroundColor: gradientFill,
                borderWidth: 2,
                fill: 'start',
                tension: 0.4,
                pointRadius: 0,
                spanGaps: true 
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { 
                legend: { display: false }, 
                tooltip: { enabled: false } 
            }, 
            scales: {
                x: { 
                    display: false, 
                    // [핵심] offset을 false로 해야 그래프가 시작점(0%)과 끝점(100%)에 붙음
                    offset: false 
                }, 
                y: { 
                    display: false, 
                    reverse: true, 
                    min: minVal - 20, 
                    max: maxVal + 30 
                }
            },
            layout: { 
                // [핵심] 좌우 패딩 20px -> CSS에서 설정한 마진 20px과 정확히 일치하여 축 정렬
                padding: { top: 16, bottom: 10, left: 15, right: 15 } 
            }
        },
        plugins: [{
            id: 'extremePoints',
            afterDraw: function(chart) {
                var ctx = chart.ctx;
                var chartArea = chart.chartArea;
                var dataset = chart.data.datasets[0];
                var meta = chart.getDatasetMeta(0);

                function drawMarker(index, value, isMax) {
                    if (!meta.data[index]) return;
                    
                    var xPos = meta.data[index].x;
                    var yPos = meta.data[index].y;

                    ctx.save();
                    
                    // 세로선
                    ctx.beginPath();
                    var vLine = ctx.createLinearGradient(0, yPos, 0, chartArea.bottom);
                    vLine.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
                    vLine.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.strokeStyle = vLine;
                    ctx.lineWidth = 1;
                    ctx.moveTo(xPos, yPos);
                    ctx.lineTo(xPos, chartArea.bottom);
                    ctx.stroke();

                    // 포인트
                    ctx.beginPath();
                    ctx.arc(xPos, yPos, 3, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = 5; ctx.shadowColor = '#ffffff';
                    ctx.fill();

                    // 시간 텍스트
                    ctx.shadowBlur = 0;
                    ctx.font = 'bold 10px Lato, sans-serif';
                    ctx.fillStyle = isMax ? '#ffffff' : '#8c8c8c';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';

                    var m = Math.floor(value / 60);
                    var s = Math.round(value % 60);
                    var labelText = (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
                    
                    ctx.fillText(labelText, xPos, yPos - 7);
                    ctx.restore();
                }

                for (var i = 0; i < dataset.data.length; i++) {
                    var val = dataset.data[i];
                    if (val !== null && val !== undefined) { 
                        if (val === minVal) drawMarker(i, val, true);
                        if (val === maxVal) drawMarker(i, val, false);
                    }
                }
            }
        }]
    });
});
</script>

<script>
(function () {
    var androidUrl = "https://play.google.com/store/apps/details?id=kr.co.smartchip.app&hl=ko";
    var iosUrl = "https://apps.apple.com/kr/app/%EC%8A%A4%EB%A7%88%ED%8A%B8%EC%B9%A9/id6759133379";

    var currentAdIndex = 0;
    var rotateMs = 3000;
    var autoTimer = null;
    var startX = 0;
    var currentX = 0;
    var isDragging = false;
    var hasMoved = false;

    function getResultAdAppLink() {
        var ua = navigator.userAgent || navigator.vendor || window.opera || "";

        if (/iPad|iPhone|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) {
            return iosUrl;
        }

        if (/Android/i.test(ua)) {
            return androidUrl;
        }

        return androidUrl;
    }

    function setResultAdLinks() {
        var links = document.querySelectorAll(".result-bottom-ad-link");
        var appLink = getResultAdAppLink();

        for (var i = 0; i < links.length; i++) {
            links[i].setAttribute("href", appLink);
        }
    }

    function slideCount() {
        return document.querySelectorAll(".result-bottom-ad-slide").length;
    }

    function updateResultBottomAd(withoutAnimation) {
        var track = document.getElementById("resultBottomAdTrack");
        var count = document.getElementById("resultBottomAdCount");
        var total = slideCount();

        if (!track || !count || total <= 0) return;

        if (currentAdIndex < 0) currentAdIndex = total - 1;
        if (currentAdIndex >= total) currentAdIndex = 0;

        if (withoutAnimation) {
            track.style.transition = "none";
        } else {
            track.style.transition = "";
        }

        track.style.transform = "translate3d(" + (-currentAdIndex * 100) + "%, 0, 0)";
        count.textContent = (currentAdIndex + 1) + "/" + total;

        if (withoutAnimation) {
            setTimeout(function () {
                track.style.transition = "";
            }, 30);
        }
    }

    function moveResultBottomAd(direction) {
        currentAdIndex += direction;
        updateResultBottomAd(false);
    }

    function restartAutoRotation() {
        if (autoTimer) clearInterval(autoTimer);
        if (slideCount() <= 1) return;

        autoTimer = setInterval(function () {
            moveResultBottomAd(1);
        }, rotateMs);
    }

    function pointerX(e) {
        if (e.touches && e.touches.length) return e.touches[0].clientX;
        if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientX;
        return e.clientX;
    }

    function onDragStart(e) {
        var rotator = document.getElementById("resultBottomAdRotator");
        var track = document.getElementById("resultBottomAdTrack");
        if (!rotator || !track) return;

        isDragging = true;
        hasMoved = false;
        startX = pointerX(e);
        currentX = startX;

        rotator.classList.add("dragging");

        if (autoTimer) clearInterval(autoTimer);
    }

    function onDragMove(e) {
        if (!isDragging) return;

        var rotator = document.getElementById("resultBottomAdRotator");
        var track = document.getElementById("resultBottomAdTrack");
        if (!rotator || !track) return;

        currentX = pointerX(e);
        var diff = currentX - startX;

        if (Math.abs(diff) > 6) hasMoved = true;

        track.style.transform = "translate3d(calc(" + (-currentAdIndex * 100) + "% + " + diff + "px), 0, 0)";
    }

    function onDragEnd(e) {
        if (!isDragging) return;

        var rotator = document.getElementById("resultBottomAdRotator");
        if (!rotator) return;

        var diff = pointerX(e) - startX;
        var threshold = Math.max(35, rotator.offsetWidth * 0.12);

        isDragging = false;
        rotator.classList.remove("dragging");

        if (Math.abs(diff) >= threshold) {
            moveResultBottomAd(diff < 0 ? 1 : -1);
        } else {
            updateResultBottomAd(false);
        }

        restartAutoRotation();

        setTimeout(function () {
            hasMoved = false;
        }, 0);
    }

    function bindResultBottomAd() {
        var rotator = document.getElementById("resultBottomAdRotator");
        if (!rotator) return;

        setResultAdLinks();
        updateResultBottomAd(true);
        restartAutoRotation();

        rotator.addEventListener("mousedown", onDragStart);
        window.addEventListener("mousemove", onDragMove);
        window.addEventListener("mouseup", onDragEnd);

        rotator.addEventListener("touchstart", onDragStart, { passive: true });
        rotator.addEventListener("touchmove", onDragMove, { passive: true });
        rotator.addEventListener("touchend", onDragEnd);
        rotator.addEventListener("touchcancel", onDragEnd);

        var links = document.querySelectorAll(".result-bottom-ad-link");
        for (var i = 0; i < links.length; i++) {
            links[i].addEventListener("click", function (e) {
                if (hasMoved) {
                    e.preventDefault();
                    return;
                }

                this.setAttribute("href", getResultAdAppLink());
            });
        }

        window.addEventListener("resize", function () {
            updateResultBottomAd(true);
        });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", bindResultBottomAd);
    } else {
        bindResultBottomAd();
    }
})();
</script>

<script type="text/javascript">
/* ===== v23: return to Follow from runner detail + parent blank-frame rescue ===== */
(function () {
    var RETURN_URL_KEY = "SC_FOLLOW_RETURN_URL";
    var RETURN_SCROLL_KEY = "SC_FOLLOW_RETURN_SCROLL_Y";
    var DETAIL_ACTIVE_KEY = "SC_FOLLOW_DETAIL_ACTIVE_AT";
    var RETURNING_KEY = "SC_FOLLOW_DETAIL_RETURNING";
    var DETAIL_LAST_URL_KEY = "SC_FOLLOW_DETAIL_LAST_URL";
    var backLock = false;
    var heartbeatTimer = null;

    function getParam(name) {
        try { return new URLSearchParams(window.location.search || "").get(name) || ""; }
        catch (e) { return ""; }
    }

    function setEverywhere(key, value) {
        value = String(value == null ? "" : value);
        try { window.sessionStorage.setItem(key, value); } catch (e) {}
        try {
            if (window.parent && window.parent !== window && window.parent.sessionStorage) {
                window.parent.sessionStorage.setItem(key, value);
            }
        } catch (e2) {}
        try {
            if (window.top && window.top !== window && window.top.sessionStorage) {
                window.top.sessionStorage.setItem(key, value);
            }
        } catch (e3) {}
    }

    function getEverywhere(key) {
        var value = "";
        try { value = window.sessionStorage.getItem(key) || ""; } catch (e) {}
        if (value) return value;
        try {
            if (window.parent && window.parent !== window && window.parent.sessionStorage) {
                value = window.parent.sessionStorage.getItem(key) || "";
            }
        } catch (e2) {}
        if (value) return value;
        try {
            if (window.top && window.top !== window && window.top.sessionStorage) {
                value = window.top.sessionStorage.getItem(key) || "";
            }
        } catch (e3) {}
        return value || "";
    }

    function removeEverywhere(key) {
        try { window.sessionStorage.removeItem(key); } catch (e) {}
        try {
            if (window.parent && window.parent !== window && window.parent.sessionStorage) {
                window.parent.sessionStorage.removeItem(key);
            }
        } catch (e2) {}
        try {
            if (window.top && window.top !== window && window.top.sessionStorage) {
                window.top.sessionStorage.removeItem(key);
            }
        } catch (e3) {}
    }

    function postToParent(payload) {
        try {
            if (window.parent && window.parent !== window) window.parent.postMessage(payload, window.location.origin);
        } catch (e) {}
        try {
            if (window.top && window.top !== window && window.top !== window.parent) window.top.postMessage(payload, window.location.origin);
        } catch (e2) {}
    }

    function isRecentFollowDetailActive() {
        var raw = getEverywhere(DETAIL_ACTIVE_KEY);
        var ts = parseInt(raw, 10);
        if (!ts || isNaN(ts)) return false;
        return Math.abs(Date.now() - ts) < (30 * 60 * 1000);
    }

    function isFollowContext() {
        return String(getParam("from") || "").toLowerCase() === "follow" ||
            !!getParam("follow_return") ||
            isRecentFollowDetailActive();
    }

    function normalizeFollowUrl(raw) {
        raw = String(raw || "").trim();
        if (!raw || /^javascript:/i.test(raw)) return "";

        try {
            var url = new URL(raw, window.location.origin);
            var host = String(url.hostname || "").toLowerCase();
            if (host !== String(window.location.hostname || "").toLowerCase() && host !== "smartchip.co.kr" && host !== "www.smartchip.co.kr") return "";
            if (!/^\/Follow(_eng)?\.html$/i.test(url.pathname || "")) return "";
            return url.pathname + url.search + url.hash;
        } catch (e) {
            return "";
        }
    }

    function buildDefaultFollowUrl() {
        var isEnglish = /_eng\.asp$/i.test(window.location.pathname || "");
        var path = isEnglish ? "/Follow_eng.html" : "/Follow.html";
        var params = new URLSearchParams();
        var usedata = getParam("usedata") || getEverywhere("SC_FOLLOW_USEDATA");
        var admin = getParam("u");

        if (usedata) params.set("usedata", usedata);
        if (admin) params.set("u", admin);

        var query = params.toString();
        return path + (query ? ("?" + query) : "");
    }

    function resolveFollowUrl() {
        var direct = normalizeFollowUrl(getParam("follow_return"));
        if (direct) return direct;

        if (isRecentFollowDetailActive()) {
            try {
                var saved = normalizeFollowUrl(getEverywhere(RETURN_URL_KEY) || "");
                if (saved) return saved;
            } catch (e) {}
        }

        return buildDefaultFollowUrl();
    }

    function findFrameIn(doc) {
        if (!doc) return null;
        return doc.getElementById("myFrame") || doc.getElementById("mainFrame");
    }

    function markDetailActive() {
        if (!isFollowContext()) return;

        var now = String(Date.now());
        var directReturn = normalizeFollowUrl(getParam("follow_return"));
        var followScroll = getParam("follow_scroll");
        var usedata = getParam("usedata") || getEverywhere("SC_FOLLOW_USEDATA");

        setEverywhere(DETAIL_ACTIVE_KEY, now);
        setEverywhere(DETAIL_LAST_URL_KEY, window.location.href);
        if (usedata) setEverywhere("SC_FOLLOW_USEDATA", usedata);
        if (directReturn) setEverywhere(RETURN_URL_KEY, new URL(directReturn, window.location.origin).href);
        if (followScroll) setEverywhere(RETURN_SCROLL_KEY, followScroll);

        postToParent({
            type: "SC_FOLLOW_DETAIL_ACTIVE",
            usedata: usedata,
            detailUrl: window.location.href,
            followReturn: directReturn ? new URL(directReturn, window.location.origin).href : (getEverywhere(RETURN_URL_KEY) || ""),
            followScroll: followScroll || getEverywhere(RETURN_SCROLL_KEY) || "",
            ts: now
        });
    }

    function rememberReturnToFollow(targetPath) {
        var absoluteUrl = new URL(targetPath, window.location.origin).href;
        var followScroll = getParam("follow_scroll") || getEverywhere(RETURN_SCROLL_KEY);
        var usedata = getParam("usedata") || getEverywhere("SC_FOLLOW_USEDATA");

        window.__SC_FOLLOW_DETAIL_RETURNING_NOW = true;

        setEverywhere(RETURN_URL_KEY, absoluteUrl);
        setEverywhere(RETURNING_KEY, "1");
        removeEverywhere(DETAIL_ACTIVE_KEY);
        if (followScroll) setEverywhere(RETURN_SCROLL_KEY, followScroll);
        if (usedata) setEverywhere("SC_FOLLOW_USEDATA", usedata);
        setEverywhere("iframeUrl", absoluteUrl);

        postToParent({
            type: "SC_FOLLOW_RETURNING",
            usedata: usedata,
            url: absoluteUrl,
            followReturn: absoluteUrl,
            followScroll: followScroll || "",
            ts: String(Date.now())
        });

        return absoluteUrl;
    }

    function returnToFollow() {
        if (backLock) return false;
        backLock = true;

        var targetPath = resolveFollowUrl();
        var absoluteUrl = rememberReturnToFollow(targetPath);

        if (window.self !== window.top) {
            try {
                var topFrame = findFrameIn(window.top.document);
                if (topFrame) {
                    topFrame.src = absoluteUrl;
                    return false;
                }
            } catch (e) {}
        }

        try {
            window.location.replace(targetPath);
        } catch (e2) {
            window.location.href = targetPath;
        }
        return false;
    }

    function wrapBackFunction(name) {
        var original = window[name];
        window[name] = function () {
            if (isFollowContext()) return returnToFollow();
            if (typeof original === "function") return original.apply(this, arguments);
            try { window.history.back(); } catch (e) {}
            return false;
        };
    }

    function installNativeBackGuard() {
        if (!isFollowContext()) return;
        if (window.__SC_FOLLOW_DETAIL_BACK_GUARD) return;
        window.__SC_FOLLOW_DETAIL_BACK_GUARD = true;

        markDetailActive();

        try { window.history.scrollRestoration = "manual"; } catch (e2) {}

        try {
            var state = window.history.state || {};
            if (!state.scFollowDetailBase) {
                state.scFollowDetailBase = true;
                window.history.replaceState(state, document.title, window.location.href);
            }
            window.history.pushState({ scFollowDetailGuard: true }, document.title, window.location.href);
            window.addEventListener("popstate", function () {
                returnToFollow();
            });
        } catch (e3) {}

        var heartbeatUntil = Date.now() + (90 * 1000);
        heartbeatTimer = window.setInterval(function () {
            if (Date.now() > heartbeatUntil || !isFollowContext() || window.__SC_FOLLOW_DETAIL_RETURNING_NOW) {
                try { window.clearInterval(heartbeatTimer); } catch (e4) {}
                return;
            }
            markDetailActive();
        }, 2500);
    }

    document.addEventListener("click", function (e) {
        if (!isFollowContext()) return;
        var target = e.target && e.target.closest ? e.target.closest("#btnBack, .top-back-button, [data-follow-detail-back]") : null;
        if (!target) return;
        e.preventDefault();
        e.stopPropagation();
        if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        returnToFollow();
    }, true);

    window.addEventListener("pageshow", function () {
        if (window.__SC_FOLLOW_DETAIL_RETURNING_NOW) return;
        markDetailActive();
    });

    window.addEventListener("pagehide", function () {
        if (window.__SC_FOLLOW_DETAIL_RETURNING_NOW) return;
        markDetailActive();
    });

    wrapBackFunction("goExpectedBack");
    wrapBackFunction("goLivePhotoBack");
    wrapBackFunction("ScriptBack");
    wrapBackFunction("ScriptBack2");
    wrapBackFunction("goBack");

    installNativeBackGuard();

    window.SC_RETURN_TO_FOLLOW = {
        isActive: isFollowContext,
        go: returnToFollow
    };
})();
</script>
