<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>버스 탑승 - 동탄 마라톤 클럽</title>
  <script>
    (function () {
      var eventId = new URLSearchParams(location.search).get("eventId") || "";
      location.replace(
        "event-home.html?eventId=" + encodeURIComponent(eventId) + "&board=1"
      );
    })();
  </script>
</head>
<body>
  <p><a href="event-home.html?board=1">회원 홈으로 이동합니다.</a></p>
</body>
</html>
