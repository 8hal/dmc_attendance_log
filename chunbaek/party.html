<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>춘백 S3 쫑파티</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/finale.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">춘백 시즌3 쫑파티</p>
      <h1 id="party-heading">2026-11-27 (금)</h1>
      <p>장소와 시간은 운영진이 저장한 값만 표시합니다.</p>
      <div class="toolbar">
        <a class="btn btn-ghost" href="./">춘백 앱</a>
      </div>
    </header>
    <p class="gate" id="login-gate" hidden>안내와 투표는 춘백 앱에 로그인된 브라우저에서 불러옵니다. <a href="./">앱 열기</a></p>
    <div id="party-notice-host"></div>
    <div id="thanks-vote-host"></div>
  </main>
  <script src="js/thanks-vote.js"></script>
  <script src="js/api.js"></script>
  <script>
    const T = window.ChunbaekThanks;
    const loginGate = document.getElementById("login-gate");
    const noticeHost = document.getElementById("party-notice-host");
    const voteHost = document.getElementById("thanks-vote-host");
    const preview = new URLSearchParams(location.search).has("preview");

    function showNotice(party) {
      noticeHost.innerHTML = T.partyNoticeHtml(party || { date: "2026-11-27", place: "", time: "", note: "" });
      const heading = document.getElementById("party-date");
      if (heading) document.getElementById("party-heading").textContent = heading.textContent;
    }

    function mountVote(view, previewMode) {
      voteHost.innerHTML = T.memberSectionHtml(view);
      const form = document.getElementById("thanks-vote-form");
      if (!form) return;
      let submitting = false;
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (submitting) return;
        const errorEl = document.getElementById("thanks-vote-error");
        const nomineeMemberId = document.getElementById("thanks-nominee").value;
        const reason = document.getElementById("thanks-reason").value;
        errorEl.textContent = "";
        if (!nomineeMemberId) {
          errorEl.textContent = "동료를 선택해 주세요";
          return;
        }
        if (previewMode) {
          mountVote({ ...view, voted: true }, true);
          return;
        }
        submitting = true;
        const button = document.getElementById("thanks-vote-submit");
        button.disabled = true;
        try {
          await apiPost("thanks-vote", { nomineeMemberId, reason }, true);
          const next = await apiGet("thanks-vote", {}, true);
          mountVote(next, false);
        } catch (err) {
          console.error(err);
          errorEl.textContent = err.message || "투표에 실패했습니다";
          button.disabled = false;
          submitting = false;
        }
      });
    }

    showNotice({ date: "2026-11-27", place: "", time: "", note: "" });

    if (preview) {
      mountVote({
        voted: false,
        candidates: [
          { memberId: "preview-b", nickname: "예시페이스" },
          { memberId: "preview-c", nickname: "예시쉼" },
        ],
      }, true);
    } else if (typeof getToken !== "function" || !getToken()) {
      loginGate.hidden = false;
    } else {
      Promise.all([
        apiGet("finale-party", {}, true),
        apiGet("thanks-vote", {}, true),
      ]).then(([party, vote]) => {
        showNotice(party);
        mountVote(vote, false);
      }).catch(() => {
        loginGate.hidden = false;
        loginGate.textContent = "쫑파티 안내를 불러오지 못했습니다. 춘백 앱에서 다시 로그인한 뒤 열어 주세요.";
      });
    }
  </script>
</body>
</html>
