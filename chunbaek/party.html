<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>춘백 S3 고마웠다 투표</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/finale.css" />
  <!-- Shoelace 2.20.1, MIT https://github.com/shoelace-style/shoelace/blob/v2.20.1/LICENSE.md -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">춘백 시즌3</p>
      <h1>당신 때문에 고마웠다</h1>
      <div class="toolbar">
        <a class="btn btn-ghost" href="./">춘백 앱</a>
      </div>
    </header>
    <p class="gate" id="login-gate" hidden>투표는 춘백 앱에 로그인된 브라우저에서 불러옵니다. <a href="./">앱 열기</a></p>
    <div id="thanks-vote-host"></div>
  </main>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>
  <script src="js/thanks-vote.js"></script>
  <script src="js/api.js"></script>
  <script>
    const T = window.ChunbaekThanks;
    const loginGate = document.getElementById("login-gate");
    const voteHost = document.getElementById("thanks-vote-host");
    const preview = new URLSearchParams(location.search).has("preview");

    function readNominee() {
      const picked = document.querySelector('#thanks-vote-form input[name="nomineeMemberId"]:checked');
      return picked ? picked.value : "";
    }

    function readReason() {
      const field = document.getElementById("thanks-reason");
      return field ? String(field.value || "") : "";
    }

    function mountVote(view, previewMode) {
      voteHost.innerHTML = T.memberSectionHtml(view);
      if (typeof T.bindThanksVote === "function") T.bindThanksVote(voteHost);
      const form = document.getElementById("thanks-vote-form");
      if (!form) return;
      let submitting = false;
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (submitting) return;
        const errorEl = document.getElementById("thanks-vote-error");
        const nomineeMemberId = readNominee();
        const reason = readReason();
        errorEl.textContent = "";
        if (!nomineeMemberId) {
          errorEl.textContent = "동료를 선택해 주세요";
          return;
        }
        const nextView = {
          ...view,
          voted: true,
          selectedMemberId: nomineeMemberId,
          draftReason: reason,
        };
        if (previewMode) {
          mountVote(nextView, true);
          return;
        }
        submitting = true;
        const button = document.getElementById("thanks-vote-submit");
        button.disabled = true;
        try {
          await apiPost("thanks-vote", { nomineeMemberId, reason }, true);
          const next = await apiGet("thanks-vote", {}, true);
          mountVote({ ...next, selectedMemberId: nomineeMemberId, draftReason: reason }, false);
        } catch (err) {
          console.error(err);
          errorEl.textContent = err.message || "투표에 실패했습니다";
          button.disabled = false;
          submitting = false;
        }
      });
    }

    if (preview) {
      mountVote({
        voted: false,
        candidates: [
          "경민", "하람", "나래", "오름", "다온", "페이스", "고은", "주원",
          "라온", "시원", "바다", "응원", "마루", "지호", "보름", "예슬",
          "사계절", "찬", "도윤", "하늘", "루나", "이안", "별하", "해달",
          "새봄", "아린", "노을", "여름", "소율", "재이", "가람", "온유",
          "서준", "연두", "수아", "웅", "가나", "자리", "모아", "봄날",
        ].map((nickname, index) => ({ memberId: `preview-${index}`, nickname })),
      }, true);
    } else if (typeof getToken !== "function" || !getToken()) {
      loginGate.hidden = false;
    } else {
      apiGet("thanks-vote", {}, true).then((vote) => {
        mountVote(vote, false);
      }).catch(() => {
        loginGate.hidden = false;
        loginGate.textContent = "투표를 불러오지 못했습니다. 춘백 앱에서 다시 로그인한 뒤 열어 주세요.";
      });
    }
  </script>
</body>
</html>
