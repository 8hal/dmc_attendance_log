<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>D-day 10의자리 테마</title>
  <style>
    :root {
      --chun-orange: #ff3214;
      --chun-cyan: #70d1f4;
      --chun-black: #000;
      --surface-muted: #f5f2ef;
      --text: #1a1a1a;
      --text-muted: #5c5c5c;
      --border: #e8e4e0;
      --card: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans KR", system-ui, sans-serif;
      background: #111;
      color: #fff;
      padding: 24px 16px 48px;
    }
    h1 { max-width: 420px; margin: 0 auto 6px; font-size: 18px; }
    .lead {
      max-width: 420px; margin: 0 auto 18px;
      color: #aaa; font-size: 13px; line-height: 1.5;
    }
    .grid {
      max-width: 420px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .cell {
      background: var(--card);
      border-radius: 14px;
      padding: 12px;
      color: var(--text);
      text-align: center;
    }
    .cell-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .marathon-dday-card {
      --dday-bg: rgba(0, 0, 0, 0.88);
      --dday-border: rgba(255, 50, 20, 0.35);
      --dday-count: var(--chun-orange);
      --dday-name: rgba(255, 255, 255, 0.92);
      --dday-meta: rgba(255, 255, 255, 0.5);

      display: flex;
      align-items: center;
      justify-content: center;
      width: 140px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      padding: 12px;
      background: var(--dday-bg);
      border: 1px solid var(--dday-border);
      border-radius: 22px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
      text-align: center;
    }
    .marathon-dday-card[data-decade="9"] {
      --dday-bg: rgba(26, 26, 26, 0.78);
      --dday-border: rgba(255, 255, 255, 0.14);
      --dday-count: #fff;
      --dday-meta: rgba(255, 255, 255, 0.55);
    }
    .marathon-dday-card[data-decade="8"] {
      --dday-bg: rgba(77, 184, 224, 0.88);
      --dday-border: rgba(255, 255, 255, 0.28);
      --dday-count: var(--chun-black);
      --dday-name: rgba(0, 0, 0, 0.88);
      --dday-meta: rgba(0, 0, 0, 0.5);
    }
    .marathon-dday-card[data-decade="7"] {
      --dday-bg: rgba(40, 18, 14, 0.92);
      --dday-border: rgba(255, 232, 227, 0.28);
      --dday-count: #ffe8e3;
      --dday-name: rgba(255, 232, 227, 0.95);
      --dday-meta: rgba(255, 232, 227, 0.55);
    }
    .marathon-dday-card[data-decade="6"] {
      --dday-bg: rgba(0, 0, 0, 0.88);
      --dday-border: rgba(255, 50, 20, 0.35);
      --dday-count: var(--chun-orange);
    }
    .marathon-dday-card[data-decade="5"] {
      --dday-bg: rgba(255, 50, 20, 0.82);
      --dday-border: rgba(255, 255, 255, 0.22);
      --dday-count: #fff;
      --dday-name: #fff;
      --dday-meta: rgba(255, 255, 255, 0.72);
    }
    .marathon-dday-card[data-decade="4"] {
      --dday-bg: rgba(224, 42, 16, 0.9);
      --dday-border: rgba(255, 255, 255, 0.2);
      --dday-count: #fff;
      --dday-name: #fff;
      --dday-meta: rgba(255, 255, 255, 0.7);
    }
    .marathon-dday-card[data-decade="3"] {
      --dday-bg: rgba(0, 0, 0, 0.92);
      --dday-border: rgba(255, 50, 20, 0.55);
      --dday-count: var(--chun-orange);
      box-shadow: 0 8px 28px rgba(255, 50, 20, 0.22);
    }
    .marathon-dday-card[data-decade="2"] {
      --dday-bg: rgba(255, 50, 20, 0.92);
      --dday-border: rgba(255, 255, 255, 0.28);
      --dday-count: #fff;
      --dday-name: #fff;
      --dday-meta: rgba(255, 255, 255, 0.75);
      box-shadow: 0 8px 28px rgba(255, 50, 20, 0.28);
    }
    .marathon-dday-card[data-decade="1"] {
      --dday-bg: rgba(0, 0, 0, 0.9);
      --dday-border: rgba(112, 209, 244, 0.45);
      --dday-count: var(--chun-cyan);
      --dday-name: #fff;
      --dday-meta: rgba(112, 209, 244, 0.75);
    }
    .marathon-dday-card[data-decade="0"] {
      --dday-bg: rgba(0, 0, 0, 0.92);
      --dday-border: rgba(112, 209, 244, 0.55);
      --dday-count: var(--chun-cyan);
      --dday-name: #fff;
      --dday-meta: rgba(255, 255, 255, 0.65);
      box-shadow: 0 8px 28px rgba(112, 209, 244, 0.2);
    }
    .marathon-dday-card.is-dday .marathon-dday-count {
      font-size: 20px;
      letter-spacing: -1px;
    }
    .marathon-dday-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      height: 100%;
    }
    .marathon-dday-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      width: 100%;
    }
    .marathon-dday-name {
      font-weight: 700;
      font-size: 11px;
      color: var(--dday-name);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .marathon-dday-date {
      font-size: 9px;
      font-weight: 600;
      color: var(--dday-meta);
    }
    .marathon-dday-countdown {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .marathon-dday-count {
      font-size: 36px;
      font-weight: 800;
      color: var(--dday-count);
      letter-spacing: -2px;
      line-height: 1;
    }
    .marathon-dday-count-label {
      margin-top: 3px;
      font-size: 10px;
      font-weight: 600;
      color: var(--dday-meta);
    }
  </style>
</head>
<body>
  <h1>10의자리마다 테마 변경</h1>
  <p class="lead">
    90+ 차분 → 60대 Ink+Orange → 50~20대 오렌지 긴장감 ↑ → 10대 이하 시안 피날레.
    실제 앱에서는 <code>data-decade</code>로 자동 전환됩니다.
  </p>

  <div class="grid" id="grid"></div>

  <script>
    const samples = [
      { decade: 9, days: 95, title: "90+" },
      { decade: 8, days: 82, title: "80s · Cyan" },
      { decade: 7, days: 71, title: "70s · Soft brand" },
      { decade: 6, days: 66, title: "60s · Ink+Orange" },
      { decade: 5, days: 55, title: "50s · Orange glass" },
      { decade: 4, days: 44, title: "40s · Hot orange" },
      { decade: 3, days: 33, title: "30s · Black+Orange" },
      { decade: 2, days: 22, title: "20s · Urgent" },
      { decade: 1, days: 15, title: "10s · Cyan spark" },
      { decade: 0, days: 7, title: "0~9 · Final" },
      { decade: 0, days: 0, title: "D-DAY", isDday: true },
    ];

    const grid = document.getElementById("grid");
    for (const s of samples) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.innerHTML = `
        <div class="cell-label">${s.title}</div>
        <div class="marathon-dday-card${s.isDday ? " is-dday" : ""}" data-decade="${s.decade}">
          <div class="marathon-dday-main">
            <div class="marathon-dday-info">
              <span class="marathon-dday-name">경주 마라톤</span>
              <span class="marathon-dday-date">2026. 10. 17 (토)</span>
            </div>
            <div class="marathon-dday-countdown">
              <span class="marathon-dday-count">${s.isDday ? "D-DAY" : s.days}</span>
              <span class="marathon-dday-count-label">${s.isDday ? "오늘" : "일 남음"}</span>
            </div>
          </div>
        </div>`;
      grid.appendChild(cell);
    }
  </script>
</body>
</html>
