<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>D-day 색 아크 — 베이스 확장</title>
  <style>
    :root {
      --chun-orange: #ff3214;
      --chun-cyan: #70d1f4;
      --chun-cyan-dark: #4db8e0;
      --chun-black: #000;
      --text: #1a1a1a;
      --text-muted: #5c5c5c;
      --border: #e8e4e0;
      --card: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans KR", system-ui, sans-serif;
      background: #111;
      color: #fff;
      padding: 24px 16px 48px;
    }
    h1 { max-width: 420px; margin: 0 auto 6px; font-size: 18px; }
    .lead {
      max-width: 420px; margin: 0 auto 8px;
      color: #aaa; font-size: 13px; line-height: 1.5;
    }
    .arc {
      max-width: 420px; margin: 0 auto 18px;
      font-size: 12px; color: #70d1f4; font-weight: 700;
    }
    .grid {
      max-width: 420px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .cell {
      background: var(--card);
      border-radius: 14px;
      padding: 12px;
      color: var(--text);
      text-align: center;
    }
    .cell-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .marathon-dday-card {
      --dday-bg: rgba(0, 0, 0, 0.88);
      --dday-border: rgba(255, 50, 20, 0.35);
      --dday-count: var(--chun-orange);
      --dday-name: rgba(255, 255, 255, 0.92);
      --dday-meta: rgba(255, 255, 255, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 128px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      padding: 8px;
      background: var(--dday-bg);
      border: 1px solid var(--dday-border);
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      text-align: center;
    }
    .marathon-dday-card[data-decade="9"] {
      --dday-bg: rgba(255, 255, 255, 0.94);
      --dday-border: rgba(232, 228, 224, 0.95);
      --dday-count: var(--text);
      --dday-name: var(--text);
      --dday-meta: var(--text-muted);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }
    .marathon-dday-card[data-decade="8"] {
      --dday-bg: rgba(245, 242, 239, 0.96);
      --dday-border: var(--border);
      --dday-count: var(--text);
      --dday-name: var(--text);
      --dday-meta: var(--text-muted);
    }
    .marathon-dday-card[data-decade="7"] {
      --dday-bg: rgba(242, 246, 248, 0.96);
      --dday-border: rgba(220, 228, 232, 0.95);
      --dday-count: var(--text);
      --dday-name: var(--text);
      --dday-meta: var(--text-muted);
    }
    .marathon-dday-card[data-decade="6"] {
      --dday-bg: rgba(236, 246, 250, 0.96);
      --dday-border: rgba(176, 220, 236, 0.7);
      --dday-count: var(--text);
      --dday-name: var(--text);
      --dday-meta: var(--text-muted);
      box-shadow: 0 6px 18px rgba(112, 209, 244, 0.08);
    }
    .marathon-dday-card[data-decade="5"] {
      --dday-bg: rgba(232, 247, 253, 0.95);
      --dday-border: rgba(112, 209, 244, 0.45);
      --dday-count: var(--chun-cyan-dark);
      --dday-name: var(--text);
      --dday-meta: var(--text-muted);
    }
    .marathon-dday-card[data-decade="4"] {
      --dday-bg: rgba(77, 184, 224, 0.9);
      --dday-border: rgba(255, 255, 255, 0.3);
      --dday-count: var(--chun-black);
      --dday-name: rgba(0, 0, 0, 0.88);
      --dday-meta: rgba(0, 0, 0, 0.5);
      box-shadow: 0 8px 24px rgba(112, 209, 244, 0.2);
    }
    .marathon-dday-card[data-decade="3"] {
      --dday-bg: rgba(0, 0, 0, 0.9);
      --dday-border: rgba(255, 255, 255, 0.14);
      --dday-count: #fff;
      --dday-name: #fff;
      --dday-meta: rgba(255, 255, 255, 0.55);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.2);
    }
    .marathon-dday-card[data-decade="2"] {
      --dday-bg: rgba(224, 42, 16, 0.9);
      --dday-border: rgba(255, 255, 255, 0.22);
      --dday-count: #fff;
      --dday-name: #fff;
      --dday-meta: rgba(255, 255, 255, 0.75);
      box-shadow: 0 8px 28px rgba(224, 42, 16, 0.28);
    }
    .marathon-dday-card[data-decade="1"] {
      --dday-bg: rgba(245, 248, 250, 0.96);
      --dday-border: rgba(200, 220, 228, 0.9);
      --dday-count: var(--text);
      --dday-name: var(--text);
      --dday-meta: var(--text-muted);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
    }
    .marathon-dday-card[data-decade="0"] {
      --dday-bg: rgba(232, 247, 253, 0.96);
      --dday-border: rgba(112, 209, 244, 0.5);
      --dday-count: var(--chun-cyan-dark);
      --dday-name: var(--text);
      --dday-meta: var(--chun-orange);
      box-shadow: 0 6px 20px rgba(112, 209, 244, 0.14);
    }
    .marathon-dday-card.is-dday {
      --dday-bg: rgba(255, 255, 255, 0.98);
      --dday-border: rgba(255, 50, 20, 0.45);
      --dday-count: var(--chun-cyan-dark);
      --dday-name: var(--text);
      --dday-meta: var(--chun-orange);
      box-shadow: 0 8px 24px rgba(255, 50, 20, 0.12);
    }
    .marathon-dday-card.is-dday .marathon-dday-count {
      font-size: 18px;
      letter-spacing: -1px;
    }
    .marathon-dday-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 100%;
      height: 100%;
    }
    .marathon-dday-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      width: 100%;
    }
    .marathon-dday-name {
      font-weight: 700;
      font-size: 10px;
      color: var(--dday-name);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .marathon-dday-date {
      font-size: 8px;
      font-weight: 600;
      color: var(--dday-meta);
    }
    .marathon-dday-countdown {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .marathon-dday-count {
      font-size: 32px;
      font-weight: 800;
      color: var(--dday-count);
      letter-spacing: -2px;
      line-height: 1;
    }
    .marathon-dday-count-label {
      margin-top: 2px;
      font-size: 9px;
      font-weight: 600;
      color: var(--dday-meta);
    }
  </style>
</head>
<body>
  <h1>색 아크 미리보기 (베이스 확장)</h1>
  <p class="lead">베이스 90~60 · 빌드 50~40 · 집중 30 · 피크 20 · 테이퍼 10 · D-DAY 시안+주황(화이트)</p>
  <p class="arc">화이트 → 시안 → 검정 → 진한 주황 → 차분 → (D-DAY 시안+주황)</p>

  <div class="grid" id="grid"></div>

  <script>
    const samples = [
      { decade: 9, days: 95, title: "90+ · 베이스 · 화이트" },
      { decade: 8, days: 82, title: "80s · 베이스 · soft light" },
      { decade: 7, days: 75, title: "70s · 베이스 · cool soft (지금)" },
      { decade: 6, days: 66, title: "60s · 베이스 · cyan hint" },
      { decade: 5, days: 55, title: "50s · 빌드 · cyan soft" },
      { decade: 4, days: 44, title: "40s · 빌드 · cyan glass" },
      { decade: 3, days: 33, title: "30s · 집중 · ink" },
      { decade: 2, days: 22, title: "20s · 피크 · deep orange" },
      { decade: 1, days: 15, title: "10s · 테이퍼 · calm soft" },
      { decade: 0, days: 7, title: "0~9 · 직전 · cyan soft" },
      { decade: 0, days: 0, title: "D-DAY · 시안+주황 (화이트)", isDday: true },
    ];

    const grid = document.getElementById("grid");
    for (const s of samples) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.innerHTML = `
        <div class="cell-label">${s.title}</div>
        <div class="marathon-dday-card${s.isDday ? " is-dday" : ""}" data-decade="${s.decade}">
          <div class="marathon-dday-main">
            <div class="marathon-dday-info">
              <span class="marathon-dday-name">경주 마라톤</span>
              <span class="marathon-dday-date">2026. 10. 17 (토)</span>
            </div>
            <div class="marathon-dday-countdown">
              <span class="marathon-dday-count">${s.isDday ? "D-DAY" : s.days}</span>
              <span class="marathon-dday-count-label">${s.isDday ? "오늘" : "일 남음"}</span>
            </div>
          </div>
        </div>`;
      grid.appendChild(cell);
    }
  </script>
</body>
</html>
