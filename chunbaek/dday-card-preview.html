<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>D-day 카드 미리보기</title>
  <style>
    :root {
      --chun-orange: #ff3214;
      --chun-cyan: #70d1f4;
      --primary-light: #ffe8e3;
      --accent-light: #e8f7fd;
      --card: #ffffff;
      --text: #1a1a1a;
      --text-muted: #5c5c5c;
      --border: #e8e4e0;
      --border-light: #f5f2ef;
      --surface-muted: #f5f2ef;
      --radius-card: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans KR", system-ui, -apple-system, sans-serif;
      background: #111;
      color: var(--text);
      padding: 24px 16px 48px;
    }
    .phone {
      max-width: 390px;
      margin: 0 auto 28px;
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    h1 {
      max-width: 390px;
      margin: 0 auto 8px;
      color: #fff;
      font-size: 18px;
    }
    .lead {
      max-width: 390px;
      margin: 0 auto 20px;
      color: #aaa;
      font-size: 13px;
      line-height: 1.5;
    }
    .label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin: 0 0 8px;
    }
    .block { margin-bottom: 22px; }

    .week-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--border-light);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
    }
    .week-summary-label { color: var(--text-muted); font-weight: 600; }
    .week-summary-count { font-weight: 800; color: var(--chun-orange); }

    .marathon-dday-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: var(--primary-light);
      background: color-mix(in srgb, var(--primary-light) 40%, var(--card));
      border: 1px solid color-mix(in srgb, var(--chun-orange) 16%, var(--border));
      border-radius: var(--radius-card);
      padding: 12px 14px 12px 12px;
      margin-top: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      border-left: 3px solid var(--chun-orange);
    }
    .marathon-dday-nudge {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-muted);
      background: var(--surface-muted);
      border-color: var(--border);
      border-left-color: var(--border);
      box-shadow: none;
    }
    .marathon-dday-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 12px;
    }
    .marathon-dday-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      padding-left: 4px;
    }
    .marathon-dday-name {
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .marathon-dday-date {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .marathon-dday-count {
      font-size: 22px;
      font-weight: 800;
      color: var(--chun-orange);
      letter-spacing: -1px;
      flex-shrink: 0;
      line-height: 1;
    }
    .marathon-dday-card.is-dday {
      background: var(--accent-light);
      border-color: color-mix(in srgb, var(--chun-cyan) 35%, var(--border));
      border-left-color: var(--chun-cyan);
    }
    .marathon-dday-card.is-dday .marathon-dday-main {
      justify-content: center;
      gap: 16px;
      text-align: center;
    }
    .marathon-dday-card.is-dday .marathon-dday-info {
      align-items: center;
      padding-left: 0;
    }
    .marathon-dday-nudge-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .old-dday {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 12px;
      width: 100%;
    }
    .old-dday .name { font-weight: 700; font-size: 15px; color: #bf360c; }
    .old-dday .date { font-size: 12px; color: #8d6e63; }
    .old-dday .count { font-size: 22px; font-weight: 800; color: #e64a19; letter-spacing: -1px; }
  </style>
</head>
<body>
  <h1>마라톤 D-day 카드 미리보기</h1>
  <p class="lead">위젯형 · 배경 융화. 왼쪽 브랜드 액센트 + 옅은 오렌지 틴트. HTML만 열면 됩니다.</p>

  <div class="phone">
    <div class="block">
      <div class="label">신규 (위젯형)</div>
      <div class="week-summary">
        <span class="week-summary-label">이번 주 출석</span>
        <span class="week-summary-count">2.0 / 3점</span>
      </div>
      <div class="marathon-dday-card">
        <div class="marathon-dday-main">
          <div class="marathon-dday-info">
            <span class="marathon-dday-name">경주 마라톤</span>
            <span class="marathon-dday-date">2026. 10. 17 (토)</span>
          </div>
          <span class="marathon-dday-count">D-66</span>
        </div>
      </div>
    </div>

    <div class="block">
      <div class="label">D-0 당일</div>
      <div class="marathon-dday-card is-dday">
        <div class="marathon-dday-main">
          <div class="marathon-dday-info">
            <span class="marathon-dday-name">🎉 오늘이 JTBC 서울마라톤 당일이에요!</span>
            <span class="marathon-dday-date">완주를 응원합니다!</span>
          </div>
          <span class="marathon-dday-count">D-DAY</span>
        </div>
      </div>
    </div>

    <div class="block">
      <div class="label">기타 + 날짜 미입력</div>
      <div class="marathon-dday-card marathon-dday-nudge">
        <span>📅 <strong>기타 대회 날짜</strong>를 프로필에 입력하면 D-day를 볼 수 있어요</span>
        <button type="button" class="marathon-dday-nudge-btn">프로필에서 입력하기</button>
      </div>
    </div>
  </div>

  <div class="phone">
    <div class="block">
      <div class="label">비교 — 이전(그라데이션)</div>
      <div class="week-summary">
        <span class="week-summary-label">이번 주 출석</span>
        <span class="week-summary-count">2.0 / 3점</span>
      </div>
      <div class="old-dday">
        <div>
          <div class="name">경주 마라톤</div>
          <div class="date">2026. 10. 17 (토)</div>
        </div>
        <div class="count">D-66</div>
      </div>
    </div>
  </div>
</body>
</html>
