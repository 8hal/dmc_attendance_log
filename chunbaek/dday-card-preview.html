<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>D-day F안 — 정사각·중앙</title>
  <style>
    :root {
      --brand-orange: #ff3214;
      --brand-cyan: #70d1f4;
      --surface-muted: #f5f2ef;
      --text: #1a1a1a;
      --text-muted: #5c5c5c;
      --border: #e8e4e0;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans KR", system-ui, -apple-system, sans-serif;
      background: #111;
      color: #fff;
      padding: 24px 16px 48px;
    }
    h1 { max-width: 390px; margin: 0 auto 6px; font-size: 18px; }
    .lead {
      max-width: 390px; margin: 0 auto 20px;
      color: #aaa; font-size: 13px; line-height: 1.5;
    }
    .phone {
      max-width: 390px;
      margin: 0 auto 24px;
      background: var(--card);
      border-radius: 16px;
      padding: 14px 14px 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
      color: var(--text);
    }
    .label {
      font-size: 12px; font-weight: 800;
      margin: 0 0 10px; color: var(--text);
    }
    .week-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
    }
    .week-summary-label { color: var(--text-muted); font-weight: 600; }
    .week-summary-count { font-weight: 800; color: var(--brand-orange); }

    .marathon-dday-card {
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(168px, 46vw);
      aspect-ratio: 1 / 1;
      margin: 14px auto 0;
      padding: 14px 12px;
      background: rgba(0, 0, 0, 0.88);
      border: 1px solid rgba(255, 50, 20, 0.35);
      border-radius: 22px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
      color: #fff;
      text-align: center;
    }
    .marathon-dday-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      gap: 8px;
    }
    .marathon-dday-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      width: 100%;
    }
    .marathon-dday-name {
      font-weight: 700;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.92);
      letter-spacing: -0.02em;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .marathon-dday-date {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
    }
    .marathon-dday-countdown {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .marathon-dday-count {
      font-size: 40px;
      font-weight: 800;
      color: var(--brand-orange);
      letter-spacing: -2px;
      line-height: 1;
    }
    .marathon-dday-count-label {
      margin-top: 4px;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.55);
    }
    .marathon-dday-card.is-dday {
      border-color: rgba(112, 209, 244, 0.4);
    }
    .marathon-dday-card.is-dday .marathon-dday-count {
      font-size: 22px;
      letter-spacing: -1px;
      color: var(--brand-cyan);
    }
  </style>
</head>
<body>
  <h1>F안 — 정사각 · 중앙 배치</h1>
  <p class="lead">Ink + Orange. 정사각형 위젯을 홈 가운데에 배치. 큰 숫자 + 「일 남음」.</p>

  <div class="phone">
    <p class="label">일반 (D-N)</p>
    <div class="week-summary">
      <span class="week-summary-label">이번 주 출석</span>
      <span class="week-summary-count">2.0 / 3점</span>
    </div>
    <div class="marathon-dday-card">
      <div class="marathon-dday-main">
        <div class="marathon-dday-info">
          <span class="marathon-dday-name">경주 마라톤</span>
          <span class="marathon-dday-date">2026. 10. 17 (토)</span>
        </div>
        <div class="marathon-dday-countdown">
          <span class="marathon-dday-count">66</span>
          <span class="marathon-dday-count-label">일 남음</span>
        </div>
      </div>
    </div>
  </div>

  <div class="phone">
    <p class="label">D-0 당일</p>
    <div class="week-summary">
      <span class="week-summary-label">이번 주 출석</span>
      <span class="week-summary-count">2.0 / 3점</span>
    </div>
    <div class="marathon-dday-card is-dday">
      <div class="marathon-dday-main">
        <div class="marathon-dday-info">
          <span class="marathon-dday-name">JTBC 서울마라톤</span>
          <span class="marathon-dday-date">완주를 응원합니다!</span>
        </div>
        <div class="marathon-dday-countdown">
          <span class="marathon-dday-count">D-DAY</span>
          <span class="marathon-dday-count-label">오늘</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
