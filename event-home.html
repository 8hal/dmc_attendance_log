<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563EB" />
  <title>대회 홈 - 동탄 마라톤 클럽</title>
  <link rel="icon" type="image/png" sizes="150x150" href="assets/dmc_logo.png" />
  <link rel="stylesheet" href="assets/design-tokens.css" />
  <link rel="stylesheet" href="assets/event-member-shell.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--dmc-color-bg);
      color: var(--dmc-color-text);
      font-family: var(--dmc-font-family);
      padding: var(--dmc-space-5);
    }
    .status {
      text-align: center;
      padding: 40px 16px;
      color: var(--dmc-color-text-secondary);
      font-size: 15px;
      line-height: 1.5;
    }
    .status-title {
      display: block;
      color: var(--dmc-color-text);
      font-weight: 600;
      margin-bottom: 10px;
    }
    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      border: none;
      border-radius: var(--dmc-radius-md);
      background: var(--dmc-color-primary);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { background: var(--dmc-color-primary-hover); }
    .btn-secondary {
      background: transparent;
      color: var(--dmc-color-primary);
      border: 1px solid var(--dmc-color-primary-border);
    }
    .summary { margin-bottom: var(--dmc-space-5); }
    .summary-title {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 8px;
      line-height: 1.3;
    }
    .summary-meta {
      margin: 0;
      font-size: 14px;
      color: var(--dmc-color-text-secondary);
      line-height: 1.45;
    }
    .nick-chip {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--dmc-color-primary-surface);
      color: var(--dmc-color-primary);
      font-size: 13px;
      font-weight: 600;
    }
    .timeline-section { margin-bottom: var(--dmc-space-5); }
    .timeline-details {
      border: 1px solid var(--dmc-color-border, var(--dmc-slate-4));
      border-radius: var(--dmc-radius-card, var(--dmc-radius-md));
      background: var(--dmc-color-surface, var(--dmc-slate-1));
      padding: 0 16px;
    }
    .timeline-details > summary {
      list-style: none;
      cursor: pointer;
      padding: 16px 0;
      font-size: 15px;
      font-weight: 600;
      user-select: none;
    }
    .timeline-details > summary::-webkit-details-marker { display: none; }
    .timeline-details > summary::after {
      content: "▾";
      float: right;
      color: var(--dmc-color-text-secondary);
      font-weight: 400;
    }
    .timeline-details[open] > summary::after { content: "▴"; }
    .timeline-list {
      list-style: none;
      margin: 0;
      padding: 0 0 16px;
      border-top: 1px solid var(--dmc-color-border, var(--dmc-slate-4));
    }
    .timeline-row {
      display: flex;
      gap: 14px;
      padding: 12px 0 0;
      font-size: 14px;
      line-height: 1.4;
    }
    .timeline-time {
      flex-shrink: 0;
      min-width: 52px;
      font-weight: 600;
      color: var(--dmc-color-primary);
    }
    .hidden { display: none !important; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(80px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      max-width: min(440px, calc(100vw - 32px));
      padding: 12px 16px;
      border-radius: 10px;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      z-index: 50;
    }
    .toast.error { background: #b91c1c; }
  </style>
</head>
<body>
  <div class="event-app">
    <div id="loading" class="status" aria-live="polite">불러오는 중…</div>

    <div id="error" class="status hidden" role="alert">
      <span class="status-title" id="errorMessage">대회를 찾을 수 없어요</span>
      <button type="button" class="btn hidden" id="retryBtn">다시 시도</button>
      <a class="btn btn-secondary" id="errorAttendanceLink" href="attendance-v2.html">출석으로 돌아가기</a>
    </div>

    <div id="pickView" class="hidden pick-section">
      <header class="summary">
        <h1 class="summary-title" id="pickEventTitle">대회</h1>
        <p class="summary-meta" id="pickEventMeta"></p>
      </header>
      <h2 class="section-title">당신은 누구신가요?</h2>
      <p class="section-sub">참가자에서 본인 닉네임을 선택하세요</p>
      <input type="search" class="pick-search" id="pickSearch" placeholder="닉네임 검색" autocomplete="off" />
      <ul class="pick-list" id="pickList"></ul>
      <p class="pick-empty hidden" id="pickEmpty">일치하는 닉네임이 없습니다</p>
      <button type="button" class="today-cta" id="pickNextBtn" disabled>시작하기</button>
      <button type="button" class="today-secondary hidden" id="pickCancelBtn">취소하고 돌아가기</button>
    </div>

    <div id="home" class="hidden">
      <header class="summary">
        <h1 class="summary-title" id="eventTitle">대회</h1>
        <p class="summary-meta" id="eventMeta"></p>
        <span id="nickChip" class="nick-chip hidden"></span>
      </header>

      <section id="profileCard" class="today-card profile-card" aria-live="polite">
        <p class="today-desc" id="profilePrompt"></p>
        <div id="profileDisplay" class="hidden">
          <div class="profile-time hidden" id="profileTimeDisplay"></div>
          <div class="bib-face hidden" id="profileBibFace" aria-label="배번">
            <div class="bib-face-band">
              <span class="bib-face-dist" id="profileBibDist"></span>
              <div class="bib-face-number" id="profileBibLarge"></div>
            </div>
            <p class="bib-face-event" id="profileBibEvent"></p>
          </div>
          <div class="result-cert hidden" id="profileResultCert" aria-label="저장 기록">
            <div class="result-cert-pills" id="profileCertPills">
              <span class="result-cert-pill hidden" id="profileCertDist"></span>
              <span class="result-cert-pill result-cert-pill-pb hidden" id="profileCertPb">PB</span>
            </div>
            <p class="result-cert-bib hidden" id="profileCertBib"></p>
            <p class="result-cert-name hidden" id="profileCertName"></p>
            <div class="result-cert-time hidden" id="profileCertTime"></div>
            <div class="result-cert-dn hidden" id="profileCertDn"></div>
            <p class="result-cert-prompt" id="profileCertPrompt"></p>
            <p class="result-cert-date hidden" id="profileCertDate"></p>
            <div class="result-cert-foot" id="profileCertFoot">
              동마클 저장 기록 · 공식 기록이 아닐 수 있어요
            </div>
          </div>
          <div class="profile-bib-large hidden" id="profileBibPlain"></div>
          <p class="profile-sub" id="profileSub"></p>
        </div>
        <form id="profileBibForm" class="hidden">
          <div class="dist-chips" id="profileDistChips"></div>
          <div id="profileBibNumberGroup" class="hidden">
            <label class="profile-label" for="profileBib">배번</label>
            <input id="profileBib" class="profile-input" inputmode="numeric" enterkeyhint="done" autocomplete="off" />
            <button type="button" class="today-cta" id="profileBibSave">저장</button>
          </div>
        </form>
        <div id="profilePendingActions" class="hidden">
          <label class="pb-check hidden" id="profilePbWrap">
            <input type="checkbox" id="profilePb" /> 이번이 PB예요
          </label>
          <div class="profile-choice-row">
            <button type="button" class="today-cta" id="profileYesBtn">맞아요</button>
            <button type="button" class="today-secondary" id="profileNoBtn">아니에요</button>
          </div>
        </div>
        <div id="profileManualForm" class="hidden">
          <button type="button" class="profile-back-btn" id="profileManualBack">돌아가기</button>
          <span class="profile-label" id="profileTimeLabel">완주 시각</span>
          <div class="profile-time-row">
            <div class="profile-time-parts" role="group" aria-labelledby="profileTimeLabel">
              <input
                id="profileTimeH"
                class="profile-input profile-time-part"
                inputmode="numeric"
                maxlength="2"
                placeholder="시"
                autocomplete="off"
                aria-label="시"
              />
              <span class="profile-time-sep" aria-hidden="true">:</span>
              <input
                id="profileTimeM"
                class="profile-input profile-time-part"
                inputmode="numeric"
                maxlength="2"
                placeholder="분"
                autocomplete="off"
                aria-label="분"
              />
              <span class="profile-time-sep" aria-hidden="true">:</span>
              <input
                id="profileTimeS"
                class="profile-input profile-time-part"
                inputmode="numeric"
                maxlength="2"
                placeholder="초"
                autocomplete="off"
                aria-label="초"
              />
            </div>
            <label class="pb-check hidden" id="profileManualPbWrap">
              <input type="checkbox" id="profileManualPb" /> 이번이 PB예요
            </label>
          </div>
          <div class="profile-dn-row">
            <button type="button" class="today-secondary" id="profileDnsBtn">DNS</button>
            <button type="button" class="today-secondary" id="profileDnfBtn">DNF</button>
          </div>
          <button type="button" class="today-cta" id="profileManualSave">저장</button>
        </div>
        <div class="profile-link-row">
          <button type="button" class="profile-link-btn hidden" id="profileEditBtn">배번 수정</button>
          <button type="button" class="profile-link-btn hidden" id="profileManualBtn">기록 직접 입력</button>
        </div>
      </section>

      <section id="busCard" class="today-card bus-card" aria-live="polite">
        <div class="today-kicker" id="busKicker">버스</div>
        <h2 class="today-title" id="busTitle">버스</h2>
        <p class="today-desc" id="busPrompt"></p>
        <button type="button" class="today-cta hidden" id="busBoardBtn">탑승하기</button>
      </section>

      <button type="button" class="switch-user-btn" id="switchUserBtn">다른 사람 선택</button>

      <section id="timeline" class="timeline-section hidden">
        <details class="timeline-details">
          <summary>당일 일정</summary>
          <ul id="timelineList" class="timeline-list"></ul>
        </details>
      </section>
    </div>
  </div>

  <nav class="event-tab-bar hidden" id="eventTabBar" aria-label="대회 탭">
    <a class="event-tab-btn active" data-tab="home" href="#"><span class="tab-icon">📍</span>홈</a>
    <a class="event-tab-btn" data-tab="roster" href="#"><span class="tab-icon">🏁</span>대회 기록</a>
  </nav>

  <div id="boardDoneOverlay" class="board-done-overlay hidden" role="status">
    <p class="board-done-text" id="boardDoneText">버스 탑승 완료</p>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="assets/distance-utils.js"></script>
  <script src="assets/event-member-copy.js"></script>
  <script src="assets/event-member-profile.js"></script>
  <script src="assets/event-home-badges.js"></script>
  <script src="assets/event-home-action.js"></script>
  <script src="assets/event-finish-time.js"></script>
  <script src="assets/event-member-tabs.js"></script>
  <script>
    const IS_LOCAL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
    const API_BASE = IS_LOCAL
      ? "http://127.0.0.1:5001/dmc-attendance/asia-northeast3/race"
      : "https://race-nszximpvtq-du.a.run.app";

    const loadingEl = document.getElementById("loading");
    const errorEl = document.getElementById("error");
    const errorMessageEl = document.getElementById("errorMessage");
    const retryBtn = document.getElementById("retryBtn");
    const errorAttendanceLink = document.getElementById("errorAttendanceLink");
    const pickViewEl = document.getElementById("pickView");
    const homeEl = document.getElementById("home");
    const toastEl = document.getElementById("toast");
    const eventTabBar = document.getElementById("eventTabBar");

    const eventTitleEl = document.getElementById("eventTitle");
    const eventMetaEl = document.getElementById("eventMeta");
    const nickChipEl = document.getElementById("nickChip");
    const switchUserBtn = document.getElementById("switchUserBtn");

    const profileCard = document.getElementById("profileCard");
    const profilePrompt = document.getElementById("profilePrompt");
    const profileDisplay = document.getElementById("profileDisplay");
    const profileTimeDisplay = document.getElementById("profileTimeDisplay");
    const profileBibFace = document.getElementById("profileBibFace");
    const profileBibDist = document.getElementById("profileBibDist");
    const profileBibLarge = document.getElementById("profileBibLarge");
    const profileBibEvent = document.getElementById("profileBibEvent");
    const profileResultCert = document.getElementById("profileResultCert");
    const profileCertDist = document.getElementById("profileCertDist");
    const profileCertPb = document.getElementById("profileCertPb");
    const profileCertBib = document.getElementById("profileCertBib");
    const profileCertName = document.getElementById("profileCertName");
    const profileCertTime = document.getElementById("profileCertTime");
    const profileCertDn = document.getElementById("profileCertDn");
    const profileCertPrompt = document.getElementById("profileCertPrompt");
    const profileCertDate = document.getElementById("profileCertDate");
    const profileBibPlain = document.getElementById("profileBibPlain");
    const profileSub = document.getElementById("profileSub");
    const profileEditBtn = document.getElementById("profileEditBtn");
    const profileBibForm = document.getElementById("profileBibForm");
    const profileBib = document.getElementById("profileBib");
    const profileDistChips = document.getElementById("profileDistChips");
    const profileBibNumberGroup = document.getElementById("profileBibNumberGroup");
    const profileBibSave = document.getElementById("profileBibSave");
    const profilePendingActions = document.getElementById("profilePendingActions");
    const profilePbWrap = document.getElementById("profilePbWrap");
    const profilePb = document.getElementById("profilePb");
    const profileYesBtn = document.getElementById("profileYesBtn");
    const profileNoBtn = document.getElementById("profileNoBtn");
    const profileManualForm = document.getElementById("profileManualForm");
    const profileTimeH = document.getElementById("profileTimeH");
    const profileTimeM = document.getElementById("profileTimeM");
    const profileTimeS = document.getElementById("profileTimeS");
    const profileDnsBtn = document.getElementById("profileDnsBtn");
    const profileDnfBtn = document.getElementById("profileDnfBtn");
    const profileManualPbWrap = document.getElementById("profileManualPbWrap");
    const profileManualPb = document.getElementById("profileManualPb");
    const profileManualSave = document.getElementById("profileManualSave");
    const profileManualBack = document.getElementById("profileManualBack");
    const profileManualBtn = document.getElementById("profileManualBtn");

    const busCard = document.getElementById("busCard");
    const busKicker = document.getElementById("busKicker");
    const busTitle = document.getElementById("busTitle");
    const busPrompt = document.getElementById("busPrompt");
    const busBoardBtn = document.getElementById("busBoardBtn");
    const boardDoneOverlay = document.getElementById("boardDoneOverlay");
    const boardDoneText = document.getElementById("boardDoneText");

    const pickEventTitle = document.getElementById("pickEventTitle");
    const pickEventMeta = document.getElementById("pickEventMeta");
    const pickSearch = document.getElementById("pickSearch");
    const pickList = document.getElementById("pickList");
    const pickEmpty = document.getElementById("pickEmpty");
    const pickNextBtn = document.getElementById("pickNextBtn");
    const pickCancelBtn = document.getElementById("pickCancelBtn");

    const timelineSection = document.getElementById("timeline");
    const timelineList = document.getElementById("timelineList");

    const pageParams = new URLSearchParams(location.search);
    const eventId = pageParams.get("eventId");
    let boardLanding = pageParams.get("board") === "1";

    let cachedEvent = null;
    let busRow = null;
    let confirmMode = "none";
    let confirmResult = null;
    let isConfirming = false;
    let isBoarding = false;
    let isSavingBib = false;
    let toastTimer = null;
    let overlayTimer = null;
    let pickSelectedNick = null;
    let pickBoardMode = false;
    let activeIdentity = { nickname: null, memberId: null };
    let profileIntent = "";
    let manualKind = "finish";
    let selectedDistance = "";
    let bibStageFocusPending = false;
    let bibComposing = false;
    let bibDraft = "";
    let timeDraft = "";
    let prevProfileState = "";
    let homeGeneration = 0;
    const CONFIRM_POLL_MS = 30000;
    let confirmPollTimer = null;

    function bumpHomeGeneration() {
      homeGeneration += 1;
    }

    function showOnly(el) {
      loadingEl.classList.add("hidden");
      errorEl.classList.add("hidden");
      pickViewEl.classList.add("hidden");
      homeEl.classList.add("hidden");
      el.classList.remove("hidden");
    }

    function showToast(message, isError) {
      if (toastTimer) clearTimeout(toastTimer);
      toastEl.textContent = message;
      toastEl.classList.toggle("error", !!isError);
      toastEl.classList.remove("hidden");
      toastTimer = setTimeout(function () {
        toastEl.classList.add("hidden");
      }, 2800);
    }

    function showError(message, opts) {
      opts = opts || {};
      errorMessageEl.textContent = message;
      eventTabBar.classList.add("hidden");
      if (opts.retry) {
        retryBtn.classList.remove("hidden");
        errorAttendanceLink.classList.add("hidden");
      } else {
        retryBtn.classList.add("hidden");
        errorAttendanceLink.classList.remove("hidden");
      }
      showOnly(errorEl);
    }

    function showRetry(message) {
      showError(message || "다시 시도", { retry: true });
    }

    function eventMetaText(event) {
      const parts = [];
      if (event.eventDate) parts.push(event.eventDate);
      if (event.location) parts.push(event.location);
      return parts.join(" · ");
    }

    function mountTabs() {
      EventMemberTabs.mount({
        eventId: eventId,
        active: "home",
        barEl: eventTabBar,
      });
    }

    function renderTimeline(event) {
      timelineList.innerHTML = "";
      timelineSection.classList.add("hidden");
    }

    function readOpenLeg(bb) {
      const leg = bb && bb.openLeg;
      return leg === "outbound" || leg === "return" ? leg : null;
    }

    function rosterOf(event) {
      return (event && event.busBoarding && event.busBoarding.roster) || [];
    }

    function matchParticipant(identity) {
      return EventMemberProfile.matchInList(
        (cachedEvent && cachedEvent.participants) || [],
        identity
      );
    }

    function matchKnownRow(identity) {
      const participant = matchParticipant(identity);
      const rosterRow = EventMemberProfile.matchInList(rosterOf(cachedEvent), identity);
      return participant || rosterRow;
    }

    function bindImeInput(el, onCommit) {
      if (!el) return;
      let composing = false;
      el.addEventListener("compositionstart", function () {
        composing = true;
      });
      el.addEventListener("compositionend", function () {
        composing = false;
        onCommit(el.value);
      });
      el.addEventListener("input", function () {
        if (composing) return;
        onCommit(el.value);
      });
    }

    function applyProfile(next) {
      if (next && next.intent) profileIntent = next.intent;
      if (next && next.manualKind) manualKind = next.manualKind;
      renderHomeCards(activeIdentity);
    }

    function onRejectClick() {
      applyProfile({ intent: "reject" });
    }

    function onManualClick() {
      manualKind = "finish";
      applyProfile({ intent: "manual" });
    }

    function onManualBack() {
      clearManualTimeParts();
      profileIntent = "";
      manualKind = "finish";
      profileManualPb.checked = false;
      renderHomeCards(activeIdentity);
    }

    function fillBibDraft(participant) {
      bibDraft = participant && participant.bib != null ? String(participant.bib).trim() : "";
      const dist = participant && participant.distance ? String(participant.distance).trim() : "";
      selectedDistance = EventHomeAction.PROFILE_DISTANCES.indexOf(dist) >= 0 ? dist : "";
      profileBib.value = bibDraft;
    }

    function renderDistanceChips() {
      profileDistChips.innerHTML = "";
      EventHomeAction.PROFILE_DISTANCES.forEach(function (dist, idx) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className =
          "dist-chip" +
          (idx < 3 ? " dist-chip-primary" : "") +
          (selectedDistance === dist ? " is-selected" : "");
        btn.textContent = EventMemberCopy.memberDistanceLabel(dist);
        btn.addEventListener("click", function () {
          const wasHidden = profileBibNumberGroup.classList.contains("hidden");
          selectedDistance = dist;
          bibStageFocusPending = wasHidden;
          renderProfileCard(activeIdentity);
        });
        profileDistChips.appendChild(btn);
      });
    }

    function hideProfileSections() {
      profileDisplay.classList.add("hidden");
      profileBibForm.classList.add("hidden");
      profilePendingActions.classList.add("hidden");
      profileManualForm.classList.add("hidden");
      profileManualBtn.classList.add("hidden");
      profileEditBtn.classList.add("hidden");
      profilePbWrap.classList.add("hidden");
      profileManualPbWrap.classList.add("hidden");
      profileTimeDisplay.classList.add("hidden");
      profileBibFace.classList.add("hidden");
      profileResultCert.classList.add("hidden");
      profileCertDist.classList.add("hidden");
      profileCertPb.classList.add("hidden");
      profileCertBib.classList.add("hidden");
      profileCertName.classList.add("hidden");
      profileCertTime.classList.add("hidden");
      profileCertDn.classList.add("hidden");
      profileCertDate.classList.add("hidden");
      profileBibPlain.classList.add("hidden");
      profileCard.className = "today-card profile-card";
    }

    function renderProfileCard(identity) {
      const participant = matchParticipant(identity);
      const isGuest = !participant;
      const card = EventHomeAction.resolveProfileCard({
        participant: participant,
        confirmMode: confirmMode,
        isGuest: isGuest,
        intent: profileIntent,
        manualKind: manualKind,
      });
      const enteringPending = card.state === "pending" && prevProfileState !== "pending";
      const enteringBib = card.state === "bib" && prevProfileState !== "bib";
      prevProfileState = card.state;

      hideProfileSections();
      profilePrompt.textContent = card.prompt || "";
      profilePrompt.classList.toggle("hidden", !card.prompt);
      profilePrompt.classList.remove("profile-prompt-question");

      if (card.state === "guest") {
        return;
      }

      if (card.state === "confirmed") {
        profileCard.classList.add("is-done");
        profilePrompt.classList.add("hidden");
        const distRaw =
          (confirmResult && confirmResult.distance) ||
          (participant && participant.distance) ||
          "";
        const distLabel = distRaw
          ? EventMemberCopy.memberDistanceLabel(distRaw)
          : "";
        const bibRaw =
          (confirmResult && confirmResult.bib) ||
          (participant && participant.bib) ||
          "";
        const cert = EventHomeBadges.confirmCertificateView(confirmResult, {
          distanceLabel: distLabel,
          name: (identity && identity.nickname) || "",
          bib: bibRaw,
          dateLabel: (cachedEvent && cachedEvent.eventDate) || "",
        });
        profileDisplay.classList.remove("hidden");
        profileResultCert.classList.remove("hidden");
        profileSub.textContent = "";
        if (cert.distanceLabel) {
          profileCertDist.textContent = cert.distanceLabel;
          profileCertDist.classList.remove("hidden");
        }
        if (cert.pb) profileCertPb.classList.remove("hidden");
        if (cert.bib) {
          profileCertBib.textContent = "배번 " + cert.bib;
          profileCertBib.classList.remove("hidden");
        }
        if (cert.name) {
          profileCertName.textContent = cert.name;
          profileCertName.classList.remove("hidden");
        }
        if (cert.showHeroTime) {
          profileCertTime.textContent = cert.timeText;
          profileCertTime.classList.remove("hidden");
        }
        if (cert.showDnHero) {
          profileCertDn.textContent = cert.dnLabel;
          profileCertDn.classList.remove("hidden");
        }
        profileCertPrompt.textContent = cert.savedPrompt;
        if (cert.dateLabel) {
          profileCertDate.textContent = cert.dateLabel;
          profileCertDate.classList.remove("hidden");
        }
        return;
      }

      if (card.state === "bib") {
        if (enteringBib && !profileBib.value) fillBibDraft(participant);
        const stage =
          card.bibStage === "distance" && selectedDistance ? "bib" : card.bibStage;
        renderDistanceChips();
        profileBibForm.classList.remove("hidden");
        profilePrompt.textContent = EventHomeAction.bibStagePrompt(stage);
        profilePrompt.classList.toggle("profile-prompt-question", stage === "distance");
        profileBibNumberGroup.classList.toggle("hidden", stage !== "bib");
        if (stage === "bib" && bibStageFocusPending) profileBib.focus();
        bibStageFocusPending = false;
        return;
      }

      const bibText = participant && participant.bib ? String(participant.bib).trim() : "";
      const distText =
        participant && participant.distance
          ? EventMemberCopy.memberDistanceLabel(participant.distance)
          : "";

      if (card.state === "wait") {
        profileDisplay.classList.remove("hidden");
        profileBibFace.classList.remove("hidden");
        profileBibPlain.classList.add("hidden");
        profileBibLarge.textContent = bibText;
        profileBibDist.textContent = distText || "";
        profileBibDist.classList.toggle("hidden", !distText);
        profileBibEvent.textContent = EventMemberCopy.memberEventTitle(
          (cachedEvent && (cachedEvent.eventName || cachedEvent.primaryName)) || ""
        );
        profileSub.textContent = "";
        if (card.largeBib) profileEditBtn.classList.remove("hidden");
        if (card.showManual) profileManualBtn.classList.remove("hidden");
        return;
      }

      if (card.state === "pending") {
        profileCard.classList.add("is-pending");
        profileDisplay.classList.remove("hidden");
        const timeText = EventHomeBadges.confirmDisplayTime(confirmResult);
        if (timeText) {
          profileTimeDisplay.textContent = timeText;
          profileTimeDisplay.classList.remove("hidden");
        }
        profileBibFace.classList.add("hidden");
        profileBibPlain.classList.remove("hidden");
        profileBibPlain.textContent = bibText;
        profileSub.textContent = [distText, bibText ? "배번 " + bibText : ""]
          .filter(Boolean)
          .join(" · ");
        if (card.showPb) {
          if (enteringPending) profilePb.checked = false;
          profilePbWrap.classList.remove("hidden");
        }
        profilePendingActions.classList.remove("hidden");
        if (card.showManual) profileManualBtn.classList.remove("hidden");
        return;
      }

      if (card.state === "manual") {
        profileManualForm.classList.remove("hidden");
        const showPb = card.showPb === true;
        profileManualPbWrap.classList.toggle("hidden", !showPb);
        if (!showPb) profileManualPb.checked = false;
        return;
      }
    }

    function renderBusCard() {
      const openLeg = readOpenLeg(cachedEvent && cachedEvent.busBoarding);
      const card = EventHomeAction.resolveBusCard({
        openLeg: openLeg,
        busRow: busRow,
      });
      const dest = EventMemberCopy.busDestinationLabel(cachedEvent || {});
      const placeClub = EventMemberCopy.busClubLabel(cachedEvent || {});

      busCard.className = "today-card bus-card";
      busBoardBtn.classList.add("hidden");
      busBoardBtn.disabled = false;

      if (card.state === "outbound_done" || card.state === "return_done") {
        busCard.classList.add("is-done");
      }

      busKicker.textContent = "버스";
      if (card.state === "ready") {
        busTitle.textContent = EventHomeAction.busRouteTitle({
          leg: card.leg,
          placeClub: placeClub,
          destination: dest,
          done: false,
        });
        busPrompt.textContent = card.prompt || "";
        busBoardBtn.textContent = card.ctaLabel || "탑승하기";
        busBoardBtn.classList.remove("hidden");
      } else if (card.state === "outbound_done") {
        busTitle.textContent = EventHomeAction.busRouteTitle({
          leg: "outbound",
          placeClub: placeClub,
          destination: dest,
          done: true,
        });
        busPrompt.textContent = "";
      } else if (card.state === "return_done") {
        busTitle.textContent = EventHomeAction.busRouteTitle({
          leg: "return",
          placeClub: placeClub,
          destination: dest,
          done: true,
        });
        busPrompt.textContent = "";
      } else if (card.state === "missing") {
        busTitle.textContent = "버스";
        busPrompt.textContent = card.prompt || "";
      } else {
        busTitle.textContent = EventHomeAction.busRouteTitle({
          leg: card.leg,
          placeClub: placeClub,
          destination: dest,
          done: false,
        });
        busPrompt.textContent = card.prompt || "";
      }
    }

    function renderHomeCards(identity) {
      renderProfileCard(identity);
      renderBusCard();
    }

    function loadBusRow(identity) {
      busRow = null;
      if (!identity || !identity.nickname) return;
      const roster = (cachedEvent && cachedEvent.busBoarding && cachedEvent.busBoarding.roster) || [];
      busRow = EventMemberProfile.matchInList(roster, identity);
    }

    async function loadConfirmState(identity) {
      const gen = homeGeneration;
      if (!identity || !identity.nickname || !matchParticipant(identity)) {
        confirmMode = "none";
        confirmResult = null;
        return;
      }

      try {
        const res = await fetch(
          API_BASE +
            "?action=group-events&subAction=my-pending-result&eventId=" +
            encodeURIComponent(eventId) +
            "&nickname=" +
            encodeURIComponent(identity.nickname)
        );
        if (homeGeneration !== gen) return;
        const data = await res.json();
        if (homeGeneration !== gen) return;
        const panel = EventHomeBadges.confirmPanelFromApi(data);
        confirmMode = panel.mode;
        confirmResult = panel.result;
        if (confirmMode === "none") {
          const p = matchParticipant(identity);
          const waitBib = p ? String(p.bib || "").trim() : "";
          const waitDist = p ? String(p.distance || "").trim() : "";
          if (waitBib && waitDist) confirmMode = "wait";
        }
      } catch (err) {
        console.error("my-pending-result error:", err);
      }
    }

    function shouldPollConfirm() {
      if (homeEl.classList.contains("hidden")) return false;
      if (confirmMode === "confirmed") return false;
      return confirmMode === "wait" || confirmMode === "pending";
    }

    function stopConfirmPoll() {
      if (confirmPollTimer) {
        clearInterval(confirmPollTimer);
        confirmPollTimer = null;
      }
    }

    function syncConfirmPoll() {
      if (!shouldPollConfirm()) {
        stopConfirmPoll();
        return;
      }
      if (confirmPollTimer) return;
      confirmPollTimer = setInterval(function () {
        if (document.hidden) return;
        if (!shouldPollConfirm()) {
          stopConfirmPoll();
          return;
        }
        const gen = homeGeneration;
        refreshHomeState(activeIdentity).then(function () {
          if (homeGeneration !== gen) return;
        });
      }, CONFIRM_POLL_MS);
    }

    async function reloadEvent() {
      const res = await fetch(
        API_BASE +
          "?action=group-events&subAction=detail&eventId=" +
          encodeURIComponent(eventId)
      );
      const data = await res.json();
      if (data && data.ok && data.event) cachedEvent = data.event;
    }

    async function refreshHomeState(identity) {
      const gen = homeGeneration;
      // openLeg is SSOT on the server — reload before painting the bus card so
      // "오는 켜기" shows 탑승하기 without a full page reload.
      try {
        await reloadEvent();
      } catch (err) {
        console.error("reloadEvent error:", err);
      }
      if (homeGeneration !== gen) return;
      loadBusRow(identity);
      // Paint bus before confirm API so #busCard never sticks on placeholder 버스/버스.
      renderBusCard();
      await loadConfirmState(identity);
      syncConfirmPoll();
      if (homeGeneration !== gen) return;
      renderHomeCards(identity);
    }

    function showBoardDoneOverlay(leg) {
      const dest = EventMemberCopy.busDestinationLabel(cachedEvent || {});
      const placeClub = EventMemberCopy.busClubLabel(cachedEvent || {});
      boardDoneText.textContent = EventHomeAction.busRouteTitle({
        leg: leg,
        placeClub: placeClub,
        destination: dest,
        done: true,
      });
      boardDoneOverlay.classList.remove("hidden");
      if (overlayTimer) clearTimeout(overlayTimer);
      overlayTimer = setTimeout(function () {
        boardDoneOverlay.classList.add("hidden");
      }, 2000);
    }

    function clearBoardQuery() {
      boardLanding = false;
      try {
        const u = new URL(location.href);
        u.searchParams.delete("board");
        history.replaceState({}, "", u.pathname + u.search);
      } catch (_err) {
        /* ignore */
      }
    }

    async function submitSelfBoard(identity, opts) {
      const openLeg = readOpenLeg(cachedEvent && cachedEvent.busBoarding);
      if (!openLeg || !identity || !identity.nickname || isBoarding) return { ok: false };
      const boardedNick = identity.nickname;
      const gen = homeGeneration;
      isBoarding = true;
      busBoardBtn.disabled = true;
      try {
        const res = await fetch(API_BASE + "?action=bus-boarding", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            subAction: "self-board",
            eventId: eventId,
            nickname: boardedNick,
            leg: openLeg,
          }),
        });
        if (homeGeneration !== gen) return { ok: false };
        if (activeIdentity.nickname !== boardedNick) return { ok: false };
        const data = await res.json();
        if (homeGeneration !== gen) return { ok: false };
        if (activeIdentity.nickname !== boardedNick) return { ok: false };
        if (!data.ok) throw new Error(data.error || "탑승 실패");
        await reloadEvent();
        if (homeGeneration !== gen) return { ok: false };
        if (activeIdentity.nickname !== boardedNick) return { ok: false };
        loadBusRow(identity);
        renderHomeCards(identity);
        const pickVisible =
          homeEl.classList.contains("hidden") || !pickViewEl.classList.contains("hidden");
        if (opts && opts.showOverlay && !data.already && !pickVisible) {
          showBoardDoneOverlay(openLeg);
        }
        return data;
      } catch (err) {
        console.error("self-board error:", err);
        showToast(err.message || "탑승 오류", true);
        busBoardBtn.disabled = false;
        return { ok: false };
      } finally {
        isBoarding = false;
      }
    }

    async function maybeAutoBoard(identity) {
      if (!boardLanding) return;
      const pickVisible =
        homeEl.classList.contains("hidden") || !pickViewEl.classList.contains("hidden");
      if (pickVisible) return;
      const openLeg = readOpenLeg(cachedEvent && cachedEvent.busBoarding);
      loadBusRow(identity);
      const legState = busRow && busRow.legs && openLeg ? busRow.legs[openLeg] : null;
      if (!openLeg || !identity.nickname || !legState || legState.required !== true) {
        clearBoardQuery();
        return;
      }
      if (legState.boarded === true) {
        clearBoardQuery();
        return;
      }
      await submitSelfBoard(identity, { showOverlay: true });
      clearBoardQuery();
    }

    async function submitUpdateBib(identity) {
      const bib = String(profileBib.value || bibDraft || "").trim();
      const distance = selectedDistance;
      if (!bib || !distance) {
        showToast("배번과 종목을 넣어 주세요.", true);
        return;
      }
      if (isSavingBib) return;
      const gen = homeGeneration;
      isSavingBib = true;
      profileBibSave.disabled = true;
      try {
        const res = await fetch(API_BASE + "?action=group-events", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            subAction: "update-bib",
            eventId: eventId,
            nickname: identity.nickname,
            bib: bib,
            distance: distance,
          }),
        });
        if (homeGeneration !== gen) return;
        const data = await res.json();
        if (homeGeneration !== gen) return;
        if (!data.ok) throw new Error(data.error || "배번 저장 실패");
        showToast(data.message || "배번이 저장되었습니다");
        profileIntent = "";
        await reloadEvent();
        if (homeGeneration !== gen) return;
        await refreshHomeState(identity);
      } catch (err) {
        console.error("update-bib error:", err);
        showToast(err.message || "배번 저장 오류", true);
      } finally {
        isSavingBib = false;
        profileBibSave.disabled = false;
      }
    }

    async function submitSelfConfirm(identity, extra) {
      if (isConfirming || !identity || !identity.nickname) return;
      const gen = homeGeneration;
      isConfirming = true;
      try {
        const body = {
          subAction: "self-confirm",
          eventId: eventId,
          nickname: identity.nickname,
        };
        if (extra) {
          if (extra.pbConfirmed != null) body.pbConfirmed = extra.pbConfirmed;
          if (extra.netTime) body.netTime = extra.netTime;
          if (extra.dnStatus) body.dnStatus = extra.dnStatus;
        }
        const res = await fetch(API_BASE + "?action=group-events", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (homeGeneration !== gen) return;
        const data = await res.json();
        if (homeGeneration !== gen) return;
        if (!data.ok) throw new Error(data.error || "확정 실패");
        showToast("기록이 반영되었습니다");
        profileIntent = "";
        await reloadEvent();
        if (homeGeneration !== gen) return;
        await refreshHomeState(identity);
      } catch (err) {
        console.error("self-confirm error:", err);
        showToast(err.message || "확정 오류", true);
      } finally {
        isConfirming = false;
      }
    }

    function renderPickList(filter) {
      const participants = (cachedEvent && cachedEvent.participants) || [];
      const roster = rosterOf(cachedEvent);
      const nicks = EventHomeAction.pickNicknames({
        boardLanding: pickBoardMode,
        openLeg: readOpenLeg(cachedEvent && cachedEvent.busBoarding),
        participants: participants,
        roster: roster,
      }).sort(function (a, b) {
        return a.localeCompare(b, "ko");
      });
      const q = (filter || "").trim().toLowerCase();
      const filtered = q
        ? nicks.filter(function (n) {
            return n.toLowerCase().includes(q);
          })
        : nicks;

      pickList.innerHTML = "";
      pickEmpty.classList.toggle("hidden", filtered.length > 0);

      filtered.forEach(function (nick) {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "pick-item" + (pickSelectedNick === nick ? " is-selected" : "");
        btn.textContent = nick;
        btn.addEventListener("click", function () {
          pickSelectedNick = nick;
          pickNextBtn.disabled = false;
          renderPickList(pickSearch.value);
        });
        li.appendChild(btn);
        pickList.appendChild(li);
      });
    }

    function resetProfileDraft() {
      profileIntent = "";
      manualKind = "finish";
      selectedDistance = "";
      bibDraft = "";
      timeDraft = "";
      prevProfileState = "";
      profileBib.value = "";
      profileTimeH.value = "";
      profileTimeM.value = "";
      profileTimeS.value = "";
      profilePb.checked = false;
      profileManualPb.checked = false;
      hideProfileSections();
    }

    function showPickView(event, opts) {
      bumpHomeGeneration();
      stopConfirmPoll();
      pickEventTitle.textContent = EventMemberCopy.memberEventTitle(
        event.eventName || event.primaryName || "대회"
      );
      pickEventMeta.textContent = eventMetaText(event);
      pickSelectedNick = null;
      pickNextBtn.disabled = true;
      pickSearch.value = "";
      const canCancel = !!(opts && opts.cancelable);
      pickBoardMode = boardLanding && !canCancel;
      pickCancelBtn.classList.toggle("hidden", !canCancel);
      renderPickList("");
      if (overlayTimer) {
        clearTimeout(overlayTimer);
        overlayTimer = null;
      }
      boardDoneOverlay.classList.add("hidden");
      eventTabBar.classList.add("hidden");
      showOnly(pickViewEl);
    }

    function showMemberHome(event, identity) {
      const prevNick = activeIdentity && activeIdentity.nickname;
      const nextNick = identity && identity.nickname;
      if (prevNick !== nextNick) {
        resetProfileDraft();
        bumpHomeGeneration();
      }
      activeIdentity = identity;
      const title = EventMemberCopy.memberEventTitle(
        event.eventName || event.primaryName || "대회"
      );
      eventTitleEl.textContent = title;
      document.title = title + " - 동탄 마라톤 클럽";
      eventMetaEl.textContent = eventMetaText(event);

      if (identity.nickname) {
        nickChipEl.textContent = identity.nickname + "님";
        nickChipEl.classList.remove("hidden");
      } else {
        nickChipEl.classList.add("hidden");
      }

      renderTimeline(event);
      mountTabs();
      showOnly(homeEl);
      const gen = homeGeneration;
      refreshHomeState(identity).then(function () {
        if (homeGeneration !== gen) return;
        maybeAutoBoard(identity);
      });
    }

    function renderEventShell(event) {
      cachedEvent = event;
      const identity = EventMemberProfile.readSavedIdentity(localStorage);
      const inParticipants = EventMemberProfile.matchInList(
        event.participants || [],
        identity
      );
      const inRoster = EventMemberProfile.matchInList(rosterOf(event), identity);
      const known = inParticipants || inRoster;

      if (!identity.nickname || !known) {
        showPickView(event);
        return;
      }
      showMemberHome(event, {
        nickname: known.nickname,
        memberId: known.memberId || identity.memberId,
      });
    }

    async function loadHome() {
      if (!eventId) {
        showError("대회를 찾을 수 없어요");
        return;
      }

      showOnly(loadingEl);
      eventTabBar.classList.add("hidden");

      try {
        const res = await fetch(
          API_BASE +
            "?action=group-events&subAction=detail&eventId=" +
            encodeURIComponent(eventId)
        );
        const data = await res.json();
        if (!data.ok || !data.event || data.event.isGroupEvent !== true) {
          showError("대회를 찾을 수 없어요");
          return;
        }
        renderEventShell(data.event);
      } catch (err) {
        console.error(err);
        showRetry("다시 시도");
      }
    }

    bindImeInput(profileBib, function (value) {
      bibDraft = value;
    });

    profileBib.addEventListener("compositionstart", function () {
      bibComposing = true;
    });
    profileBib.addEventListener("compositionend", function () {
      bibComposing = false;
    });

    function readManualNetTime() {
      return EventFinishTime.composeNetTime(
        profileTimeH.value,
        profileTimeM.value,
        profileTimeS.value
      );
    }

    function syncTimeDraftFromParts() {
      const composed = readManualNetTime();
      timeDraft = composed.ok ? composed.netTime : "";
      if (profileIntent === "manual" && timeDraft && (manualKind === "dns" || manualKind === "dnf")) {
        manualKind = "finish";
        renderHomeCards(activeIdentity);
      }
    }

    function bindTimePart(input, sanitize, nextInput) {
      input.addEventListener("input", function () {
        const cleaned = sanitize(input.value);
        if (cleaned !== input.value) input.value = cleaned;
        syncTimeDraftFromParts();
        if (nextInput && cleaned.length >= 2) nextInput.focus();
      });
    }

    bindTimePart(profileTimeH, EventFinishTime.sanitizeHourDigits, profileTimeM);
    bindTimePart(profileTimeM, EventFinishTime.sanitizeMinSecDigits, profileTimeS);
    bindTimePart(profileTimeS, EventFinishTime.sanitizeMinSecDigits, null);

    let pickComposing = false;
    pickSearch.addEventListener("compositionstart", function () {
      pickComposing = true;
    });
    pickSearch.addEventListener("compositionend", function () {
      pickComposing = false;
      renderPickList(pickSearch.value);
    });
    pickSearch.addEventListener("input", function () {
      if (pickComposing) return;
      renderPickList(pickSearch.value);
    });

    pickNextBtn.addEventListener("click", function () {
      if (!pickSelectedNick || !cachedEvent) return;
      EventMemberProfile.syncNicknames(localStorage, pickSelectedNick);
      showMemberHome(cachedEvent, { nickname: pickSelectedNick, memberId: null });
    });

    switchUserBtn.addEventListener("click", function () {
      if (!cachedEvent) return;
      showPickView(cachedEvent, { cancelable: true });
    });

    pickCancelBtn.addEventListener("click", function () {
      if (!cachedEvent) return;
      const identity = EventMemberProfile.readSavedIdentity(localStorage);
      const known = matchKnownRow(identity);
      if (!known) {
        pickCancelBtn.classList.add("hidden");
        return;
      }
      showMemberHome(cachedEvent, {
        nickname: known.nickname,
        memberId: known.memberId || identity.memberId,
      });
    });

    function onManualSave() {
      const extra = {};
      if (manualKind === "dns") extra.dnStatus = "DNS";
      else if (manualKind === "dnf") extra.dnStatus = "DNF";
      else {
        const composed = readManualNetTime();
        if (!composed.ok) {
          showToast("완주 시각을 시·분·초로 넣어 주세요.", true);
          return;
        }
        extra.netTime = composed.netTime;
        if (profileManualPb.checked) extra.pbConfirmed = true;
      }
      submitSelfConfirm(activeIdentity, extra);
    }

    profileEditBtn.addEventListener("click", onRejectClick);
    profileNoBtn.addEventListener("click", onRejectClick);
    profileManualBtn.addEventListener("click", onManualClick);
    profileBibSave.addEventListener("click", function () {
      submitUpdateBib(activeIdentity);
    });
    profileBibForm.addEventListener("submit", function (e) {
      e.preventDefault();
      if (bibComposing) return;
      submitUpdateBib(activeIdentity);
    });
    profileYesBtn.addEventListener("click", function () {
      submitSelfConfirm(activeIdentity, {
        pbConfirmed: profilePb.checked === true,
      });
    });
    function clearManualTimeParts() {
      profileTimeH.value = "";
      profileTimeM.value = "";
      profileTimeS.value = "";
      timeDraft = "";
    }

    profileDnsBtn.addEventListener("click", function () {
      clearManualTimeParts();
      applyProfile({ intent: "manual", manualKind: "dns" });
    });
    profileDnfBtn.addEventListener("click", function () {
      clearManualTimeParts();
      applyProfile({ intent: "manual", manualKind: "dnf" });
    });
    profileManualSave.addEventListener("click", onManualSave);
    profileManualBack.addEventListener("click", onManualBack);
    busBoardBtn.addEventListener("click", function () {
      submitSelfBoard(activeIdentity, { showOverlay: true });
    });

    retryBtn.addEventListener("click", function () {
      loadHome();
    });

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState !== "visible") return;
      if (homeEl.classList.contains("hidden") || !activeIdentity) return;
      const gen = homeGeneration;
      refreshHomeState(activeIdentity).then(function () {
        if (homeGeneration !== gen) return;
      });
    });

    loadHome();
  </script>
</body>
</html>
