<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563EB" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="app-version" content="0.21.6" />
  <title>배번 - 동탄 마라톤 클럽</title>
  <link rel="icon" type="image/png" sizes="150x150" href="../assets/dmc_logo.png" />
  <link rel="stylesheet" href="../assets/design-tokens.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--dmc-color-bg, #F8FAFC);
      color: #0F172A;
      font-family: var(--dmc-font-family, system-ui, sans-serif);
      padding: 20px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    }
    .nav { margin: 0 0 12px; font-size: 14px; }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .nav a { color: #2563EB; font-weight: 700; text-decoration: none; }
    .wrap { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .card { background: #fff; border: 1px solid #E2E8F0; border-radius: 12px; padding: 16px; margin-top: 12px; }
    label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 6px; }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      font-size: 16px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips button, .btn {
      border: 1px solid #E2E8F0;
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .chips button.active { background: #EFF6FF; color: #2563EB; border-color: #2563EB; }
    .btn { display: block; width: 100%; border-radius: 8px; background: #2563EB; color: #fff; border: none; margin-top: 16px; text-align: center; text-decoration: none; }
    .hint, .error { font-size: 13px; line-height: 1.45; }
    .hint { color: #64748B; }
    .error { color: #DC2626; }
    .hidden { display: none !important; }
    .nick-btn {
      display: block;
      width: 100%;
      text-align: left;
      margin-top: 8px;
      padding: 12px;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      background: #fff;
      color: #0F172A;
      font-size: 16px;
      cursor: pointer;
    }
    .field-label { display: block; font-size: 13px; font-weight: 700; margin: 14px 0 6px; }
    .wave-chips {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    .wave-chip {
      min-height: 48px;
      border: 1px solid #E2E8F0;
      background: #fff;
      border-radius: 10px;
      padding: 6px 2px;
      cursor: pointer;
      color: #0F172A;
    }
    .wave-chip[aria-pressed="true"] {
      background: #EFF6FF;
      border-color: #2563EB;
      color: #2563EB;
    }
    .wave-name { display: block; font-size: 18px; font-weight: 800; line-height: 1.1; }
    .goal-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-top: 14px;
    }
    #goalLabel { font-size: 13px; font-weight: 700; }
    .goal-pace {
      min-height: 1.2em;
      font-size: 14px;
      font-weight: 700;
      color: #2563EB;
      font-variant-numeric: tabular-nums;
    }
    .goal-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }
    .goal-row input {
      width: 64px;
      padding: 8px 4px;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .goal-sep { font-size: 24px; font-weight: 700; color: #94A3B8; }
    .bib-face {
      position: relative;
      margin: 0 0 12px;
      padding: 16px 14px 12px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #dbe3f0;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }
    .bib-face-band {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      margin: 0 0 10px;
      padding: 14px 16px 12px;
      border-radius: 4px;
      background: var(--dmc-color-primary, #2563eb);
      color: #0f172a;
    }
    .bib-face-dist {
      position: absolute;
      top: 6px;
      left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--dmc-color-primary, #2563eb);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.3;
    }
    .bib-face-number {
      font-size: 40px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.04em;
      color: #0f172a;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .bib-face-event {
      margin: 0 4px 2px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      line-height: 1.35;
    }
    .saved-line {
      margin: 8px 0 0;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
    }
    .btn-secondary {
      background: #fff;
      color: #0F172A;
      border: 1px solid #E2E8F0;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="nav"><a id="boardLink" href="index.html">응원 보드 보기</a></p>
    <h1>배번</h1>
    <p class="hint" id="pagePurpose">배번과 완주 목표 시간을 입력해 주세요. 실시간 응원과 기록 수집에 쓰입니다.</p>
    <p class="hint" id="eventInfo">불러오는 중…</p>
    <div id="error" class="error hidden"></div>
    <div id="pick" class="card hidden">
      <p class="hint">참가자 명단에 있는 닉네임만 나옵니다. 본인이 없으면 운영진에게 알려 주세요.</p>
      <input id="nickSearch" type="search" placeholder="닉네임 검색" autocomplete="off" />
      <div id="nickList"></div>
    </div>
    <form id="form" class="card hidden">
      <p id="who"></p>
      <p id="notFullNote" class="hint hidden"></p>
      <label for="bib">배번</label>
      <input id="bib" inputmode="numeric" enterkeyhint="done" autocomplete="off" />
      <div id="fullFields" class="hidden">
        <div id="waveField">
          <p class="field-label" id="waveLabel">출발 그룹</p>
          <div class="wave-chips" id="waveChips" role="radiogroup" aria-labelledby="waveLabel"></div>
          <input type="hidden" id="wave" value="" />
          <p class="hint">배번에 적힌 출발 그룹을 고르세요. 고르지 않으면 앞쪽 그룹으로 봅니다.</p>
        </div>
        <p class="hint hidden" id="waveNone">출발 그룹이 아직 없습니다. 배번과 목표는 저장할 수 있습니다.</p>
        <div class="goal-block">
          <div class="goal-head">
            <span id="goalLabel">완주 목표 시간</span>
            <span id="goalPace" class="goal-pace" aria-live="polite"></span>
          </div>
          <div class="goal-row" role="group" aria-labelledby="goalLabel">
            <input id="goalH" inputmode="numeric" maxlength="2" placeholder="3" aria-label="시" enterkeyhint="next" autocomplete="off" />
            <span class="goal-sep" aria-hidden="true">:</span>
            <input id="goalM" inputmode="numeric" maxlength="2" placeholder="00" aria-label="분" enterkeyhint="next" autocomplete="off" />
            <span class="goal-sep" aria-hidden="true">:</span>
            <input id="goalS" inputmode="numeric" maxlength="2" placeholder="00" aria-label="초" enterkeyhint="done" autocomplete="off" />
          </div>
        </div>
      </div>
      <p id="formError" class="error hidden"></p>
      <button class="btn" type="submit" id="saveBtn">저장</button>
    </form>
    <div id="saved" class="card hidden">
      <div class="bib-face" aria-label="배번">
        <div class="bib-face-band">
          <span class="bib-face-dist" id="savedDist"></span>
          <div class="bib-face-number" id="savedBib"></div>
        </div>
        <p class="bib-face-event" id="savedEvent"></p>
      </div>
      <p class="saved-line" id="savedWave"></p>
      <p class="saved-line" id="savedGoal"></p>
      <p class="hint" id="savedNote"></p>
      <a class="btn" id="savedBoard" href="index.html">응원 보드 보기</a>
      <button type="button" class="btn btn-secondary" id="savedEdit">배번·목표 수정</button>
    </div>
  </div>
  <script src="../assets/distance-utils.js"></script>
  <script src="../assets/event-bib-form.js"></script>
  <script>
    const IS_LOCAL = location.hostname === "localhost" || location.hostname === "127.0.0.1";
    const API_BASE = IS_LOCAL
      ? "http://127.0.0.1:5001/dmc-attendance/asia-northeast3/race"
      : "https://race-nszximpvtq-du.a.run.app";
    const params = new URLSearchParams(location.search);
    const eventId = params.get("eventId") || "";
    let event = null;
    let nickname = params.get("nickname") || "";
    let composing = false;
    let editing = false;
    const SAVE_ERRORS = {
      "goal out of range": "목표는 1시간에서 10시간 사이로 넣어 주세요.",
      "unknown waveId": "조 목록이 바뀌었습니다. 새로고침 후 다시 골라 주세요.",
      "wave and goal are full marathon only": "조와 목표는 풀코스만 넣습니다.",
    };

    function esc(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function showError(message) {
      const el = document.getElementById("error");
      el.textContent = message;
      el.classList.remove("hidden");
    }

    function participant() {
      return ((event && event.participants) || []).find(function (row) {
        return row.nickname === nickname;
      }) || null;
    }

    function renderNicks() {
      const all = (event && event.participants) || [];
      const q = document.getElementById("nickSearch").value.trim();
      const list = all.filter(function (row) {
        return !q || String(row.nickname || "").indexOf(q) >= 0;
      });
      const root = document.getElementById("nickList");
      if (!all.length) {
        root.innerHTML = '<p class="hint">아직 참가 명단이 없습니다. 운영진에게 알려 주세요.</p>';
        return;
      }
      if (!list.length) {
        root.innerHTML = '<p class="hint">그 닉네임은 명단에 없습니다.</p>';
        return;
      }
      root.innerHTML = list.map(function (row) {
        return '<button type="button" class="nick-btn" data-nick="' + esc(row.nickname) + '">' + esc(row.nickname) + "</button>";
      }).join("");
    }

    function clearFormFields() {
      document.getElementById("bib").value = "";
      document.getElementById("goalH").value = "";
      document.getElementById("goalM").value = "";
      document.getElementById("goalS").value = "";
      document.getElementById("wave").value = "";
    }

    function renderSummary(summary) {
      document.getElementById("pick").classList.add("hidden");
      document.getElementById("form").classList.add("hidden");
      document.getElementById("saved").classList.remove("hidden");
      document.querySelector(".nav").classList.add("hidden");
      document.getElementById("pagePurpose").classList.add("hidden");
      document.getElementById("savedBib").textContent = summary.bib;
      document.getElementById("savedDist").textContent = formatDistance(summary.distance);
      document.getElementById("savedEvent").textContent = String((event && (event.primaryName || event.eventName)) || "").trim();
      const waveEl = document.getElementById("savedWave");
      waveEl.textContent = summary.waveName;
      waveEl.classList.toggle("hidden", !summary.waveName);
      const goalEl = document.getElementById("savedGoal");
      goalEl.textContent = summary.goalLine;
      goalEl.classList.toggle("hidden", !summary.goalLine);
      let noteText = "";
      if (!summary.full) noteText = EventBibForm.nonFullCourseNote(formatDistance(summary.distance));
      else if (!summary.goalLine) noteText = "완주 목표 시간을 넣으면 응원 보드에 나옵니다.";
      else if (!((event.waves || []).length)) noteText = "출발 그룹이 등록되면 응원 보드에 나옵니다.";
      const note = document.getElementById("savedNote");
      note.textContent = noteText;
      note.classList.toggle("hidden", !noteText);
      document.getElementById("savedEdit").textContent = summary.full ? "배번·목표 수정" : "배번 수정";
      document.getElementById("savedBoard").href = "index.html?eventId=" + encodeURIComponent(eventId);
    }

    function render() {
      const row = participant();
      if (!row) {
        editing = false;
        document.getElementById("form").classList.add("hidden");
        document.getElementById("saved").classList.add("hidden");
        document.getElementById("pick").classList.remove("hidden");
        document.querySelector(".nav").classList.remove("hidden");
        document.getElementById("pagePurpose").classList.remove("hidden");
        renderNicks();
        return;
      }
      const summary = editing ? null : EventBibForm.savedBibSummary(row, (event && event.waves) || []);
      if (summary) {
        renderSummary(summary);
        return;
      }
      document.getElementById("saved").classList.add("hidden");
      document.querySelector(".nav").classList.remove("hidden");
      document.getElementById("pagePurpose").classList.remove("hidden");
      renderForm();
    }

    function renderForm() {
      const row = participant();
      if (!row) {
        render();
        return;
      }
      document.getElementById("pick").classList.add("hidden");
      document.getElementById("form").classList.remove("hidden");
      document.getElementById("who").textContent = row.nickname;
      if (!document.getElementById("bib").value) {
        document.getElementById("bib").value = row.bib || "";
      }
      const saveDistance = EventBibForm.cheerBibSaveDistance(row);
      const fullCourse = saveDistance === "full";
      const note = document.getElementById("notFullNote");
      note.textContent = fullCourse ? "" : EventBibForm.nonFullCourseNote(formatDistance(saveDistance));
      note.classList.toggle("hidden", fullCourse);
      document.getElementById("fullFields").classList.toggle("hidden", !fullCourse);
      const waves = EventBibForm.sortWaves(event.waves || []);
      const showWaves = EventBibForm.waveChoiceVisible(waves.length);
      const typedWave = document.getElementById("wave").value;
      const savedWave = waves.some(function (wave) { return wave.id === row.waveId; }) ? row.waveId : "";
      const picked = waves.some(function (wave) { return wave.id === typedWave; }) ? typedWave : savedWave;
      document.getElementById("waveChips").innerHTML = waves.map(function (wave) {
        const pressed = wave.id === picked ? "true" : "false";
        return '<button type="button" class="wave-chip" data-wave-id="' + esc(wave.id) + '" aria-pressed="' + pressed + '">' +
          '<span class="wave-name">' + esc(wave.name) + "</span>" +
          "</button>";
      }).join("");
      document.getElementById("wave").value = picked;
      document.getElementById("waveField").classList.toggle("hidden", !showWaves);
      document.getElementById("waveNone").classList.toggle("hidden", showWaves);
      const savedGoal = EventBibForm.goalFieldsFromSec(row.goalFinishSec);
      if (savedGoal && !document.getElementById("goalH").value) {
        document.getElementById("goalH").value = savedGoal.h;
        document.getElementById("goalM").value = savedGoal.m.padStart(2, "0");
        document.getElementById("goalS").value = savedGoal.s.padStart(2, "0");
      }
      renderGoalPace();
    }

    function renderGoalPace() {
      document.getElementById("goalPace").textContent = EventBibForm.goalPaceLabel({
        goalH: document.getElementById("goalH").value,
        goalM: document.getElementById("goalM").value,
        goalS: document.getElementById("goalS").value,
      });
    }

    function onGoalInput(id) {
      if (composing) return;
      const el = document.getElementById(id);
      const cleaned = String(el.value || "").replace(/\D/g, "").slice(0, 2);
      if (cleaned !== el.value) el.value = cleaned;
      const nextId = EventBibForm.goalFocusNext(id, cleaned);
      if (nextId) {
        const next = document.getElementById(nextId);
        if (next) next.focus();
      }
      renderGoalPace();
    }

    ["bib", "goalH", "goalM", "goalS"].forEach(function (id) {
      const el = document.getElementById(id);
      el.addEventListener("compositionstart", function () { composing = true; });
      el.addEventListener("compositionend", function () { composing = false; });
    });
    ["goalH", "goalM", "goalS"].forEach(function (id) {
      document.getElementById(id).addEventListener("input", function () { onGoalInput(id); });
    });
    document.getElementById("waveChips").addEventListener("click", function (event) {
      const btn = event.target.closest("[data-wave-id]");
      if (!btn) return;
      const waveId = btn.getAttribute("data-wave-id");
      document.getElementById("wave").value = waveId;
      document.querySelectorAll("#waveChips [data-wave-id]").forEach(function (chip) {
        chip.setAttribute("aria-pressed", chip === btn ? "true" : "false");
      });
    });

    document.getElementById("nickSearch").addEventListener("input", renderNicks);
    document.getElementById("nickList").addEventListener("click", function (event) {
      const btn = event.target.closest("[data-nick]");
      if (!btn) return;
      nickname = btn.getAttribute("data-nick");
      editing = false;
      clearFormFields();
      render();
    });
    document.getElementById("form").addEventListener("submit", async function (submitEvent) {
      submitEvent.preventDefault();
      if (composing) return;
      const formError = document.getElementById("formError");
      formError.classList.add("hidden");
      const bib = document.getElementById("bib").value.trim();
      const saveDistance = EventBibForm.cheerBibSaveDistance(participant());
      if (!nickname || !bib) {
        formError.textContent = "닉네임과 배번이 필요합니다.";
        formError.classList.remove("hidden");
        return;
      }
      const val = function (id) { return document.getElementById(id).value; };
      const goalError = saveDistance === "full"
        ? EventBibForm.goalFieldsError({ goalH: val("goalH"), goalM: val("goalM"), goalS: val("goalS") })
        : "";
      if (goalError) {
        formError.textContent = goalError;
        formError.classList.remove("hidden");
        return;
      }
      const body = EventBibForm.buildBibBody({
        eventId: eventId,
        nickname: nickname,
        bib: bib,
        distance: saveDistance,
        waveId: val("wave"),
        goalH: val("goalH"),
        goalM: val("goalM"),
        goalS: val("goalS"),
      });
      document.getElementById("saveBtn").disabled = true;
      try {
        const res = await fetch(API_BASE + "?action=group-events", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(SAVE_ERRORS[data.error] || data.error || "저장 실패");
        editing = false;
        clearFormFields();
        await load();
        const saved = document.getElementById("saved");
        if (!saved.classList.contains("hidden")) saved.scrollIntoView({ block: "center" });
      } catch (err) {
        formError.textContent = err.message || "저장 실패";
        formError.classList.remove("hidden");
      } finally {
        document.getElementById("saveBtn").disabled = false;
      }
    });

    async function load() {
      if (!eventId) {
        showError("대회 링크가 올바르지 않습니다.");
        return;
      }
      const res = await fetch(API_BASE + "?action=group-events&subAction=detail&eventId=" + encodeURIComponent(eventId));
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "대회를 찾지 못했습니다");
      event = data.event;
      document.getElementById("eventInfo").textContent = (event.primaryName || event.eventName || "대회") + " · " + (event.eventDate || "");
      render();
    }

    document.getElementById("savedEdit").addEventListener("click", function () {
      editing = true;
      clearFormFields();
      render();
      document.getElementById("bib").focus();
    });
    document.getElementById("boardLink").href = "index.html?eventId=" + encodeURIComponent(eventId);
    load().catch(function (err) { showError(err.message); });
  </script>
</body>
</html>
